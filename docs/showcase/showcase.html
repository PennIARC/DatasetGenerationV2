nfirmed with the zoomed 640x640 revision (ADR 0016: native 640x640 crop, mine scale 0.25-0.40 in 4 linear bins, scene zoom coupling, 0-4 mines). Every graph on this page is the planned distribution from the 3000-row sampling plan (scripts/generate_dataset.py --plan-only). Stratified factors are evenly sampled: equal-count buckets per image, value uniform inside the bucket, buckets crossed with each other by a balanced design. Everything else is randomized with the generator's tuned distributions. Before / after pairs use the same seed and change only the named parameter.", "glossary": {"stratified": "Evenly sampled: the range is cut into buckets and every bucket gets exactly the same number of images (or a fixed quota); the value is random inside it.", "randomized": "Each image / mine draws the value independently (i.i.d.) from the configured distribution.", "balanced design": "Bucket columns are shuffled, then rows are swapped inside a column to make every pair of factors as evenly crossed as possible (pairwise chi-square minimised); marginal counts never change.", "chi-square": "Sum over table cells of (count - expected)^2 / expected; 0 = perfectly even crossing.", "PSF": "Point-spread function: how the lens smears a point (here a Gaussian blur).", "YOLO label": "One line per box: class x_centre y_centre width height, normalised to 0-1.", "native crop": "Cutting a window out of the rendered image pixel for pixel (no resize or interpolation), so nothing gets blurred or stretched.", "zoom coupling": "Scaling everything physical (rocks, debris, ground texture, soil details) with the mine size, as if the camera moved closer."}, "tables": [{"title": "Decisions", "columns": ["decision", "plan", "status"], "rows": [["Image format / resolution (NEW)", "640x640 JPEG as a NATIVE crop of the 1920x1080 render (no resize, no resampling); the window position is uniform and every mine is placed fully inside it (8 px margin); labels normalised to the crop", "confirmed (ADR 0016)" integer per photo."], ["override / config", "GRASS_IMAGES_TO_SAMPLE, GRASS_CLIPPINGS_PER_IMAGE"]], "figure": {"image": "images/params/grass_clippings.png", "label": "Grass clippings (v1 photos)", "caption": "Configured distribution from controlPanel (drawn inside the renderer, not in the plan table)."}, "notes": "Configured distribution per 1920x1080 render BEFORE zoom coupling (drawn inside the renderer, not replicated in the plan; 20000 draws). With zoom z = scale / 0.2 (1.25-2.0) the count is multiplied by z^-2 (stochastic rounding) and sizes by z; about 20 % of the render lands in the 640x640 crop."}]}, {"id": "dataset", "tab": "Dataset: live sample", "type": "dataset", "title": "Dataset v2: live random sample", "intro": "24 randomly sampled finished images from a dataset under output_dataset/, with their YOLO boxes, plus live progress of the render. The Dataset menu switches between the datasets the server finds there (e.g. v2_3000 = zoomed 640x640 crops, v2_3000_wide = 960x960 crops of the original zoomed-out plan) without restarting it; the newest is the default. Works while a dataset is still being generated: the info panel refreshes every 10 s, and Resample draws a new random 24 from everything finished so far. Needs the local server: python3 scripts/serve_dataset_view.py, then open http://127.0.0.1:8765/showcase.html#dataset.", "glossary": {"finished image": "An image whose label file (labels/\u003csplit\u003e/\u003cname\u003e.txt) and sidecar (meta/\u003cname\u003e.json, written last) both exist and are complete.", "box": "One YOLO label line (class xc yc w h, normalised to the image size), drawn as a green rectangle.", "seed": "base_seed:render_index, i.e. render_scene(seed=2026 (v2_3000) or 2027 (v2_3000_wide), index=k); retries use index 100000 + 10 k + attempt.", "sun_el / shadow / overcast": "Sun elevation in degrees, direct-sun shadow strength, overcast (soft light) flag.", "scale": "Mean mine scale of the image (MINE_SCALE): 0.25-0.40 in v2_3000, 0.1-0.4 in v2_3000_wide.", "buried / burial_max": "Number of buried mines; largest achieved hidden fraction of a mine's top-down area.", "face_down / blades_on_mine": "Number of face-down mines; grass blades drawn over mines.", "rate / ETA": "Finished images per minute over the last 10 min, and the time left at that rate.", "dataset": "A folder under output_dataset/ with plan/plan.json or images/; variant zoom640 (640x640, zoom coupling) or wide (960x960, no coupling, ADR 0018)."}, "port": 8765, "sample_size": 24, "server_cmd": "python3 scripts/serve_dataset_view.py"}, {"id": "training", "tab": "Training: live", "type": "training", "title": "YOLO11n training: live progress", "intro": "Live view of the YOLO11n baseline runs in kernelBashing/baselines/yolo11n/runs: epoch and within-epoch progress, elapsed time and ETA, losses and validation metrics per epoch, live test examples (16 fixed val images with ground truth and the newest predictions, scrubbable through the epochs), and the report figures once a run ends. Updates are pushed by the local server as the run's files change (Server-Sent Events, polling every 5 s as a fallback). Needs the local server: python3 scripts/serve_dataset_view.py, then open http://127.0.0.1:8765/showcase.html#training.", "glossary": {"epoch": "One full pass over the training split (2700 images). An epoch ends with validation on the 300 val images, which adds one row to ultra/results.csv.", "iteration / batch": "One optimiser step on one batch (16 images by default): 2700 / 16 = 169 iterations per epoch.", "box loss": "Bounding-box regression loss (CIoU, complete intersection over union): how far predicted boxes are from the labelled boxes in position, size and shape. Lower is better.", "cls loss": "Classification loss (binary cross-entropy): how confident the model is that a box contains a mine (the only class, pfm1) versus background. Lower is better.", "dfl loss": "Distribution Focal Loss: YOLO predicts each box edge as a probability distribution over offsets; DFL sharpens that distribution around the true edge. Lower is better.", "train vs val loss": "Train losses are running means over the epoch's batches (with augmentation); val losses are computed on the val split after the epoch, without augmentation.", "IoU": "Intersection over union: overlap area of a predicted and a true box divided by their combined area (1 = identical).", "precision (P)": "Of the boxes the model predicted, the fraction that match a real mine (IoU \u003e= 0.5).", "recall (R)": "Of the real mines, the fraction the model found.", "mAP50": "Mean average precision at IoU 0.5: area under the precision-recall curve when a prediction counts as correct at \u003e= 50 % overlap (averaged over classes; here a single class). 0-1, higher is better.", "mAP50-95": "mAP averaged over IoU thresholds 0.50, 0.55, ..., 0.95, so it also rewards tight boxes. The main COCO-style score; ultralytics keeps best.pt by it.", "lr": "Learning rate: step size of the optimiser (AdamW here). Warm-up over the first 3 epochs, then a linear decay.", "GPU memory": "Apple GPU (MPS, Metal Performance Shaders) memory: the GPU_mem column of the progress bar while training, otherwise torch.mps.driver_allocated_memory at the end of each epoch (timing.json).", "images / s": "Training throughput: train images processed per second (iterations per second x batch size while live).", "ETA": "Estimated time left: rest of the current epoch (from the progress bar, or from the median epoch time) plus the remaining epochs x the median epoch time. It excludes the final best.pt validation and the report (about 1-2 min).", "status": "running = files changed recently (within 90 s, or 1.5 x the epoch time + 30 s, whichever is longer); finished / failed = the final status that train_yolo.py writes into timing.json and config.json; failed is also shown when nothing changed for that long and no final status was written (crashed or killed process).", "SSE": "Server-Sent Events: one long-lived HTTP response through which the server pushes an update whenever the run's files change (and a heartbeat every 15 s). live / polling / offline shows which transport is in use.", "tqdm progress bar": "The per-iteration progress line ultralytics prints to the console. train.log in the run folder does not contain it; start the server with --console-log FILE pointing at the redirected console output to get exact within-epoch progress, otherwise it is estimated from time.", "live test examples": "16 val images picked once per run by a uniform random draw (seed shown) and kept fixed, so each epoch is judged on the same pictures. kernelBashing/baselines/yolo11n/scripts/live_predict.py predicts them on the CPU each time last.pt is saved (and with best.pt at the end, shown as 'final'). 'Resample 16' draws a new random set and predicts it with the current weights; the old set and its history move to live_preds/archive/.", "GT": "Ground truth: the labelled box of a real mine in the image (green).", "conf": "Confidence: the model's score (0-1) that a predicted box is a mine. Boxes below the threshold slider are hidden and not counted; boxes under 0.1 are not stored.", "TP / FP / FN": "True positive = a prediction that overlaps a not-yet-matched GT box with IoU \u003e= 0.5 (each GT box matches at most one prediction, highest confidence first). False positive = a prediction that matches no GT box (dashed red). False negative = a GT box no prediction matched, a missed mine (dashed green). Precision = TP / (TP + FP), recall = TP / (TP + FN).", "NMS": "Non-maximum suppression: removes overlapping duplicate predictions of the same object, keeping the most confident one (ultralytics defaults, IoU 0.7)."}, "port": 8765, "server_cmd": "python3 scripts/serve_dataset_view.py"}], "assets": {}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("showcase-data").textContent);
var PAGES = DATA.pages || [], ASSETS = DATA.assets || {};
var $ = function(id){ return document.getElementById(id); };
var main = $("main"), tabsEl = $("tabs");

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k === "class") e.className = v;
    else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){} return null; }
function str(v){ return (typeof v === "string" && v.trim()) ? v : ""; }
function arr(v){ return Array.isArray(v) ? v : []; }
/* stat tiles: keep "box 0.779", "12.0 s", "mAP50-95" on one line; lines break only between items */
function nbsp(t){ return typeof t === "string" ? t.replace(/([A-Za-z0-9.]) (?=[0-9–≈%]|s\b|min\b|h\b|GB\b|MB\b|px\b)/g, "$1\u00a0").replace(/([A-Za-z0-9])-(?=[0-9])/g, "$1\u2011") : t; }
/* table alignment: a column whose cells are all numbers (optionally with a unit, or blank / dash) is right-aligned,
   header included (class "num"); every other column stays left-aligned, header included */
var NUM_RE = /^[-+\u2212]?(\d[\d,]*(\.\d*)?|\.\d+)(e[-+]?\d+)?\s*(%|s|px|ms|GB|MB|KB|B|°|x|×)?$/i;
function isNumText(s){ s = String(s === null || s === undefined ? "" : s).trim(); return s === "" || s === "–" || s === "-" || NUM_RE.test(s); }
function numCol(values){ var any = false; for (var i = 0; i < values.length; i++){ var v = String(values[i] === null || values[i] === undefined ? "" : values[i]).trim(); if (!isNumText(v)) return false; if (v && v !== "–" && v !== "-") any = true; } return any; }

/* ---------- images ---------- */
function placeholder(label, cls, why){
  return el("div", {"class": "ph " + (cls || ""), role: "img", "aria-label": (label || "image") + " (" + why + ")"},
    [(label || "image") + " — " + why]);
}
/* frame follows the image's own aspect ratio (e.g. 16:9 renders, 640x640 dataset crops); CSS value = fallback */
function fitAspect(box, im, maxVh){
  if (!box || !im || im.tagName !== "IMG") return;
  var set = function(){
    if (!(im.naturalWidth && im.naturalHeight)) return;
    var r = im.naturalWidth / im.naturalHeight;
    box.style.aspectRatio = im.naturalWidth + " / " + im.naturalHeight;
    if (maxVh) box.style.maxWidth = "min(900px, " + (maxVh * r).toFixed(2) + "vh)";   /* tall images: cap the height */
  };
  if (im.complete) set(); else im.addEventListener("load", set);
}
function img(src, alt, cls){
  if (!src) return placeholder(alt, cls, "no image");
  if (ASSETS[src]) src = ASSETS[src];
  var i = el("img", {src: src, alt: alt || "", loading: "lazy", decoding: "async", "class": cls || ""});
  i.addEventListener("error", function(){
    if (i.parentNode) i.parentNode.replaceChild(placeholder(alt, cls, "image missing"), i);
  });
  return i;
}

/* ---------- lightbox ---------- */
var lb = {items: [], idx: 0, opener: null};
function lbShow(){
  var it = lb.items[lb.idx]; if (!it) return;
  var st = $("lbStage"); st.textContent = "";
  if (it.render) st.appendChild(it.render());   /* training live test examples: image + GT / prediction overlay */
  else if (it.boxes){   /* dataset page: image + YOLO boxes overlay (b toggles) */
    var bw = el("div", {"class": "lbwrap" + (it.boxesOn() ? " showbox" : "")}, [img(it.image, it.label, "")]);
    it.boxes.forEach(function(b){ bw.appendChild(boxDiv(b)); });
    st.appendChild(bw);
  } else st.appendChild(img(it.image, it.label, ""));
  var info = $("lbInfo"); info.textContent = "";
  info.appendChild(el("div", {text: it.label + "  (" + (lb.idx+1) + "/" + lb.items.length + ")"}));
  if (str(it.params)) info.appendChild(el("div", {"class":"par", text: it.params}));
  if (str(it.caption)) info.appendChild(el("div", {text: it.caption}));
  if (it.tags && it.tags.length) info.appendChild(el("div", {"class":"par", text: "tags: " + it.tags.join(", ")}));
  if (it.meta){
    var tb = el("table", {"class":"tbl"});
    Object.keys(it.meta).forEach(function(k){ tb.appendChild(el("tr", null, [el("td", {text: k}), el("td", {text: fmt(it.meta[k])})])); });
    info.appendChild(tb);
  }
  if (it.toggle){
    var on = it.isFlagged();
    info.appendChild(el("button", {"class":"fbtn", type:"button", "aria-pressed": String(on), text: on ? "Flagged (f to unflag)" : "Flag as wrong (f)",
      onclick: function(){ it.toggle(); lbShow(); $("lbStage").focus && 0; }}));
  }
  if (it.boxes){
    var bon = it.boxesOn();
    info.appendChild(el("button", {"class":"fbtn", type:"button", "aria-pressed": String(bon), text: bon ? "Boxes: on (b)" : "Boxes: off (b)",
      onclick: function(){ it.toggleBoxes(); lbShow(); }}));
  }
  var multi = lb.items.length > 1;
  $("lbPrev").style.display = $("lbNext").style.display = multi ? "" : "none";
}
function lbOpen(items, idx, opener){
  lb.items = items; lb.idx = idx; lb.opener = opener;
  var box = $("lb"); box.hidden = false; box.classList.add("open");
  lbShow(); $("lbClose").focus();
}
function lbClose(){
  var box = $("lb"); box.classList.remove("open"); box.hidden = true;
  if (lb.opener) lb.opener.focus();
}
function lbStep(d){ var n = lb.items.length; if (!n) return; lb.idx = (lb.idx + d + n) % n; lbShow(); }
$("lbClose").addEventListener("click", lbClose);
$("lbPrev").addEventListener("click", function(){ lbStep(-1); });
$("lbNext").addEventListener("click", function(){ lbStep(1); });
$("lb").addEventListener("click", function(e){ if (e.target === $("lb") || e.target === $("lbStage")) lbClose(); });
document.addEventListener("keydown", function(e){

    items.forEach(function(it, i){
      var b = el("button", {type: "button", "aria-label": "Enlarge: " + it.label, onclick: function(ev){ lbOpen(items, i, ev.currentTarget); }}, [img(it.image, it.label, "")]);
      g.appendChild(el("figure", {"class": "figure"}, [b, el("figcaption", null, [el("b", {text: it.label + ": "}), it.caption])]));
    });
    gallerySec.appendChild(g);
  }
  function renderCfg(r){
    var c = r.config || {};
    var facts = [["run folder", r.name], ["started", fmtClock(r.start)], ["epochs planned", c.epochs], ["batch / image size", c.batch + " / " + c.imgsz + " px"],
      ["device", c.device + (c.amp === false ? " (AMP off, float32)" : c.amp ? " (AMP on)" : "")], ["initial weights", c.init],
      ["train fraction", c.fraction], ["patience (early stop)", c.patience], ["close_mosaic (last N epochs without mosaic)", c.close_mosaic],
      ["flipud / seed / workers", c.flipud + " / " + c.seed + " / " + c.workers], ["dataset", (c.dataset || "") + (c.n_train ? " (" + c.n_train + " train, " + c.n_val + " val)" : "")],
      ["classes", fmt(c.classes)], ["versions", "ultralytics " + c.ultralytics + " · torch " + c.torch + " · python " + c.python],
      ["resumes", c.resumes], ["command args", c.argv], ["notes", c.notes]];
    cfgSec.textContent = "";
    var det = el("details", {"class": "glossary"}, [el("summary", {text: "Run configuration and notes"}), factsTable(facts.map(function(f){ return [f[0], f[1] === undefined || f[1] === null ? "–" : f[1]]; }))]);
    if (str(r.notes_md)) det.appendChild(el("pre", {"class": "log", text: r.notes_md}));
    cfgSec.appendChild(det);
  }

  /* transport: SSE stream, polling fallback */
  function qs(){ return S.follow || !S.name ? "" : "?name=" + encodeURIComponent(S.name); }
  function stopAll(){
    if (S.es){ S.es.close(); S.es = null; }
    if (S.pollT){ clearInterval(S.pollT); S.pollT = null; }
    if (S.retryT){ clearTimeout(S.retryT); S.retryT = null; }
  }
  function onData(d){ if (!S.alive || S.paused) return; warn.hidden = true; if (d.run !== undefined) showRun(d.run); }
  function fail(e){
    if (!S.alive) return;
    if (!S.everOk){
      root.textContent = "";
      root.appendChild(offlineBox(e && e.status === 404 ? "The server answering on this port has no training endpoints: it is an older version. Stop it (Ctrl-C) and start it again." :
        "Could not reach /api/training/runs (" + (e ? e.message : "error") + "): the server is not running or this page is served by something else."));
      cleanup(); return;
    }
    setMode("offline");
    warn.hidden = false; warn.textContent = "Lost contact with the server. Showing the last data; it reconnects by itself (or restart it with: " + cmd + ").";
  }
  function poll(){
    if (!S.alive || S.paused) return;
    getJSON("/api/training/runs").then(function(d){
      if (!S.alive || S.paused) return;
      showRuns(d);
      return getJSON("/api/training/run" + qs()).then(function(x){ if (S.mode !== "live") setMode("polling"); onData(x); LPV.refresh(); });
    }).catch(fail);
  }
  function startPolling(){
    if (S.es){ S.es.close(); S.es = null; }
    if (!S.pollT){ S.pollT = setInterval(function(){ if (!document.hidden) poll(); }, 5000); }
    if (S.mode !== "offline") setMode("polling");
    poll();
    if (window.EventSource && !S.retryT) S.retryT = setTimeout(function(){ S.retryT = null; if (S.alive && !S.paused) connect(); }, 60000);
  }
  function connect(){
    if (!S.alive || S.paused) return;
    if (!window.EventSource) return startPolling();
    if (S.es) S.es.close();
    var es = S.es = new EventSource("/api/training/stream" + qs()), opened = false;
    S.errs = 0;
    es.onopen = function(){ opened = true; };
    es.addEventListener("runs", function(e){ if (S.paused) return; try { showRuns(JSON.parse(e.data)); } catch(x){} });
    es.addEventListener("run", function(e){
      if (S.pollT){ clearInterval(S.pollT); S.pollT = null; }
      S.errs = 0; setMode("live");
      try { onData(JSON.parse(e.data)); } catch(x){}
    });
    es.addEventListener("heartbeat", function(){ S.errs = 0; setMode("live"); });
    es.addEventListener("preds", function(e){ if (S.paused) return; try { LPV.setIndex(JSON.parse(e.data)); } catch(x){} });
    es.onerror = function(){
      if (S.es !== es) return;
      S.errs++;
      if (es.readyState === 2 || S.errs >= 2 || !opened){ es.close(); S.es = null; startPolling(); }
      else setMode("connecting");
    };
  }
  function reconnect(){ stopAll(); setMode("connecting"); connect(); }
  function cleanup(){ S.alive = false; stopAll(); if (S.tickT) clearInterval(S.tickT); S.tickT = null; }
  trCleanup = cleanup;
  S.tickT = setInterval(function(){ if (S.alive && !S.paused) tick(); }, 1000);
  /* first load: one plain request decides between "server ok" and the offline/old-server message, then stream */
  getJSON("/api/training/runs").then(function(d){
    if (!S.alive) return;
    showRuns(d);
    return getJSON("/api/training/run").then(function(x){ onData(x); connect(); });
  }).catch(fail);
}

/* ---------- tables / figures (optional: page.tables, feature.facts, feature.figure) ---------- */
function dataTable(cols, rows){
  var t = el("table");
  var nc = Math.max(cols.length, rows.reduce(function(m, r){ return Math.max(m, arr(r).length); }, 0)), isNum = [];
  for (var j = 0; j < nc; j++) isNum.push(numCol(rows.map(function(r){ return arr(r)[j]; })));
  if (cols.length) t.appendChild(el("thead", null, [el("tr", null, cols.map(function(c, j){ return el("th", {scope: "col", "class": isNum[j] ? "num" : null, text: String(c)}); }))]));
  var tb = el("tbody");
  rows.forEach(function(r){ tb.appendChild(el("tr", null, arr(r).map(function(c, j){ return el("td", {"class": isNum[j] ? "num" : null, text: c === null || c === undefined ? "" : String(c)}); }))); });
  t.appendChild(tb);
  return t;
}
function pageTable(t){
  t = t || {};
  var box = el("section", {"class": "ptable"});
  if (str(t.title)) box.appendChild(el("h2", {text: t.title}));
  box.appendChild(el("div", {"class": "scroll"}, [dataTable(arr(t.columns), arr(t.rows))]));
  if (str(t.note)) box.appendChild(el("p", {"class": "tnote", text: t.note}));
  return box;
}
function factsTable(facts){
  var t = el("table");
  var tb = el("tbody");
  facts.forEach(function(kv){ kv = arr(kv); tb.appendChild(el("tr", null, [el("th", {scope: "row", text: String(kv[0] || "")}), el("td", {text: String(kv[1] === undefined ? "" : kv[1])})])); });
  t.appendChild(tb);
  return el("div", {"class": "facts"}, [t]);
}
function figureBlock(fg){
  var it = {label: str(fg.label) || "figure", params: str(fg.params), caption: str(fg.caption), image: str(fg.image)};
  var b = el("button", {type: "button", "aria-label": "Enlarge: " + it.label, onclick: function(ev){ lbOpen([it], 0, ev.currentTarget); }},
    [img(it.image, it.label, "")]);
  return el("figure", {"class": "figure"}, [b, it.caption ? el("figcaption", {text: it.caption}) : null]);
}

/* ---------- feature card ---------- */
function featureCard(pageId, f){
  f = f || {};
  var id = pageId + "-" + (str(f.id) || "feature");
  var card = el("section", {"class": "card", id: id, "aria-labelledby": id + "-h"});
  var h = el("h2", {id: id + "-h"}, [str(f.title) || str(f.id) || "Feature"]);
  if (str(f.flag)) h.appendChild(el("span", {"class": "chip", title: "Config flag", text: f.flag}));
  card.appendChild(h);
  if (str(f.summary)) card.appendChild(el("p", {"class": "summary", text: f.summary}));
  if (str(f.how)) card.appendChild(el("p", {"class": "meta"}, [el("b", {text: "How it works: "}), f.how]));
  if (str(f.code)) card.appendChild(el("p", {"class": "meta"}, [el("b", {text: "Code: "}), el("code", {text: f.code})]));
  var facts = arr(f.facts);
  if (facts.length) card.appendChild(factsTable(facts));
  if (f.figure && typeof f.figure === "object") card.appendChild(figureBlock(f.figure));
  var opts = arr(f.options);
  if (opts.length){
    card.appendChild(el("h3", {text: "Options"}));
    card.appendChild(gallery(opts));
  }
  var bas = arr(f.before_after);
  if (bas.length){
    card.appendChild(el("h3", {text: "Before / after"}));
    bas.forEach(function(b){ card.appendChild(beforeAfter(b)); });
  }
  if (str(f.notes)) card.appendChild(el("div", {"class": "notes"}, [el("b", {text: "Limitations and notes"}), f.notes]));
  return card;
}

/* ---------- page ---------- */
var spy = null;
function renderPage(page, featureId){
  if (spy) { spy.disconnect(); spy = null; }
  if (gridCleanup) { gridCleanup(); gridCleanup = null; }
  if (dsCleanup) { dsCleanup(); dsCleanup = null; }
  if (trCleanup) { trCleanup(); trCleanup = null; }
  gridResize = null;
  main.textContent = "";
  main.setAttribute("aria-labelledby", "pageTitle");
  var head = el("div", {"class": "pagehead"}, [el("h1", {id: "pageTitle", text: str(page.title) || str(page.tab) || page.id})]);
  if (str(page.intro)) head.appendChild(el("p", {"class": "intro", text: page.intro}));
  main.appendChild(head);
  if (page.missing){
    main.appendChild(el("div", {"class": "empty", role: "status"}, [
      el("b", {text: "Images not generated yet. "}),
      page.missing === true ? "The manifest for this page was not found." : page.missing]));
    return;
  }
  var feats = arr(page.features);
  var gl = page.glossary && typeof page.glossary === "object" ? Object.keys(page.glossary) : [];
  if (gl.length){
    var dl = el("dl");
    gl.forEach(function(t){ dl.appendChild(el("dt", {text: t})); dl.appendChild(el("dd", {text: String(page.glossary[t])})); });
    main.appendChild(el("details", {"class": "glossary"}, [el("summary", {text: "Terms used on this page"}), dl]));
  }
  if (page.type === "grid"){ renderGrid(page); return; }
  if (page.type === "dataset"){ renderDataset(page); return; }
  if (page.type === "training"){ renderTraining(page); return; }
  arr(page.tables).forEach(function(t){ main.appendChild(pageTable(t)); });
  if (!feats.length){
    main.appendChild(el("div", {"class": "empty", role: "status", text: "No features listed for this page yet."}));
    return;
  }
  var ol = el("ol");
  feats.forEach(function(f){
    var fid = pageId(page) + "-" + (str(f.id) || "feature");
    ol.appendChild(el("li", null, [el("a", {href: "#" + fid, "data-fid": fid, text: str(f.title) || str(f.id) || "Feature",
      onclick: function(e){ e.preventDefault(); goto(page.id, f.id); }})]));
  });
  var toc = el("nav", {"class": "toc", "aria-label": "Features on this page"}, [el("h2", {text: "Features"}), ol]);
  var col = el("div");
  feats.forEach(function(f){ col.appendChild(featureCard(pageId(page), f)); });
  main.appendChild(el("div", {"class": "layout"}, [toc, col]));
  if ("IntersectionObserver" in window){
    var links = {};
    [].forEach.call(ol.querySelectorAll("a"), function(a){ links[a.getAttribute("data-fid")] = a; });
    spy = new IntersectionObserver(function(es){
      es.forEach(function(en){
        if (en.isIntersecting){
          for (var k in links) links[k].classList.remove("active");
          if (links[en.target.id]) links[en.target.id].classList.add("active");
        }
      });
    }, {rootMargin: "-20% 0px -70% 0px"});
    [].forEach.call(col.children, function(c){ spy.observe(c); });
  }
}
function pageId(p){ return p.id; }

/* ---------- routing / tabs ---------- */
var current = null;
function buildTabs(){
  tabsEl.textContent = "";
  PAGES.forEach(function(p, i){
    tabsEl.appendChild(el("button", {"class": "tab", role: "tab", id: "tab-" + p.id, type: "button",
      "aria-selected": "false", tabindex: "-1", "data-i": String(i), text: str(p.tab) || str(p.title) || p.id,
      onclick: function(){ goto(p.id); }}));
  });
}
tabsEl.addEventListener("keydown", function(e){
  var k = e.key, n = PAGES.length, i = PAGES.indexOf(current);
  var j = k === "ArrowRight" ? (i+1)%n : k === "ArrowLeft" ? (i-1+n)%n : k === "Home" ? 0 : k === "End" ? n-1 : -1;
  if (j < 0) return;
  e.preventDefault(); goto(PAGES[j].id);
  $("tab-" + PAGES[j].id).focus();
});
function parseHash(){
  var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  for (var i = 0; i < PAGES.length; i++){
    var id = PAGES[i].id;
    if (h === id) return {page: PAGES[i], feat: ""};
    if (h.indexOf(id + "-") === 0) return {page: PAGES[i], feat: h.slice(id.length + 1)};
  }
  return null;
}
function goto(pid, fid){
  location.hash = "#" + pid + (fid ? "-" + fid : "");   /* triggers hashchange -> apply() */
  if (location.hash === "#" + pid + (fid ? "-" + fid : "")) apply();
}
function apply(){
  var r = parseHash(), page, feat = "";
  if (r) { page = r.page; feat = r.feat; }
  else {
    var saved = store("showcase-tab");
    page = PAGES.filter(function(p){ return p.id === saved; })[0] || PAGES[0];
  }
  if (!page) { main.textContent = "No pages."; return; }
  if (page !== current){
    current = page;
    store("showcase-tab", page.id);
    [].forEach.call(tabsEl.children, function(t){
      var on = t.id === "tab-" + page.id;
      t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1;
    });
    document.title = (str(page.tab) || page.id) + " — Dataset Generator Showcase";
    renderPage(page, feat);
    window.scrollTo(0, 0);
  }
  if (feat){
    var t = document.getElementById(page.id + "-" + feat);
    if (t) t.scrollIntoView();
  }
}
window.addEventListener("hashchange", apply);
window.addEventListener("pagehide", function(){ if (gridCleanup) gridCleanup(); if (trCleanup) { trCleanup(); trCleanup = null; } });
document.addEventListener("visibilitychange", function(){ if (document.hidden && gridCleanup) gridCleanup(); });
window.addEventListener("pageshow", function(e){ if (e.persisted && current && current.type === "training"){ current = null; apply(); } });
function setTb(){ var h = document.querySelector(".topbar"); if (h) document.documentElement.style.setProperty("--tb", h.offsetHeight + "px"); }
window.addEventListener("resize", function(){ setTb(); if (gridResize) gridResize(); });

/* ---------- theme ---------- */
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function effectiveTheme(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t) return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
applyTheme(store("showcase-theme"));
$("themeBtn").addEventListener("click", function(){
  var n = effectiveTheme() === "dark" ? "light" : "dark";
  applyTheme(n); store("showcase-theme", n);
});

buildTabs();
setTb();
apply();
})();
</script>
</body>
