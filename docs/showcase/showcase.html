<script id="showcase-data" type="application/json">{"pages": [{"id": "v1", "tab": "v1: original generator", "title": "v1: the original synthetic mine dataset generator", "intro": "v1 builds each training picture by layering real ground photos, scattered debris, pre-rendered mine sprites, more debris on top, and a final camera-like shader. It writes a YOLO label file for every image. Every picture on this page was made with v1's own code and a fixed random seed; where an effect is small, the crops are zoomed.", "glossary": {"alpha": "A per-pixel transparency value: 0 is see-through, 255 is solid.", "Otsu thresholding": "An automatic way to pick a brightness cutoff that splits an image into 'object' and 'background'; v1 uses it to cut rocks and grass out of their white photo backdrops.", "cutout": "An image with its background removed (made transparent) so it can be pasted onto another picture.", "sprite": "A small pre-made image of an object (here a rendered mine) that is placed onto scenes.", "YOLO label": "A text line 'class x_center y_center width height' with positions as fractions of the image size (0 to 1).", "bounding box": "The smallest axis-aligned rectangle around an object; what the detector is trained to predict.", "normalised": "Expressed as a fraction of image width/height so it does not depend on resolution.", "shader": "A small program that runs on the GPU for every pixel; here it applies the camera-like effects.", "post-processing": "Effects applied to the finished picture after the scene is drawn.", "grain / noise": "Random per-pixel brightness speckle, like a camera sensor in low light.", "chromatic aberration": "Coloured fringes at edges because a lens focuses red and blue slightly differently; here red and blue are shifted sideways.", "vignette": "Darkening toward the corners of the image.", "contrast": "How far light and dark parts are pushed apart around mid-grey.", "occlusion": "One object hiding part of another.", "overgrowth": "In this project, a second debris layer drawn on top of the mines to hide parts of them.", "seed": "A number that fixes the random generator so a result can be reproduced; before/after pairs share a seed.", "nearest-neighbour zoom": "Enlarging by repeating each pixel as a block, so you see the real pixels.", "Lanczos": "A smooth resampling method used when resizing images.", "density_factor": "A multiplier for how many debris items are drawn.", "yaw / pitch / roll": "Rotation angles of the 3D model about its vertical, side and front axes when rendering a sprite.", "in-plane rotation": "Rotating a flat image around its centre, like turning a photo on a table.", "stretch (resize without letterbox)": "Resizing to a new aspect ratio by squashing, rather than adding padding bars.", "moderngl": "A Python library for running OpenGL (GPU) code, used to run the shader."}, "features": [{"id": "backgrounds", "title": "Background photos", "summary": "Real lawn, soil and gravel photos give the scene its texture and lighting, so the detector learns mines against realistic ground rather than flat colour.", "how": "Picks one of 15 photos, scales it to cover 1920x1080 times a random zoom U(1, 1.5), then blits it at a random offset.", "code": "DatasetGenerator/main.py: generate_one_image (step 1)", "options": [{"label": "all 15 photos", "params": "assets/backgrounds/*.png (7 grassN.png + 8 screenshots)", "image": "images/v1/bg_contact_sheet.jpg", "caption": "Centre-cropped thumbnails of every background photo v1 can pick."}, {"label": "zoom 1.0", "params": "zoom=1.0, crop offset fraction (0.4, 0.3)", "image": "images/v1/bg_zoom_1_0.jpg", "caption": "Same photo and same crop anchor; higher zoom shows a smaller, blurrier part of the photo."}, {"label": "zoom 1.25", "params": "zoom=1.25, crop offset fraction (0.4, 0.3)", "image": "images/v1/bg_zoom_1_25.jpg", "caption": "Same photo and same crop anchor; higher zoom shows a smaller, blurrier part of the photo."}, {"label": "zoom 1.5", "params": "zoom=1.5, crop offset fraction (0.4, 0.3)", "image": "images/v1/bg_zoom_1_5.jpg", "caption": "Same photo and same crop anchor; higher zoom shows a smaller, blurrier part of the photo."}], "before_after": [{"label": "Random crop offset", "before": "images/v1/bg_crop_a.jpg", "after": "images/v1/bg_crop_b.jpg", "before_label": "offset near top-left", "after_label": "offset near bottom-right", "caption": "Same photo, zoom 1.5: the random offset gives two different-looking training images."}], "notes": "Only 15 photos, so the ground variety is limited. High zoom upsamples the photo and looks soft. Several 'backgrounds' are screenshots of stock photos and some carry faint watermarks."}, {"id": "dirt", "title": "Dirt specks", "summary": "Small brown squares scattered everywhere add clutter that looks vaguely like soil crumbs and stops the detector from keying on 'anything small and dark'.", "how": "EnvironmentDebris._generate_dirt draws 50-200 (x density_factor) filled squares of 4-12 px with colour DIRT_COLOR_BASE (101,67,33) +- DIRT_VARIANCE 40.", "code": "DatasetGenerator/objects.py: EnvironmentDebris._generate_dirt", "options": [{"label": "density 0.5", "params": "density_factor=0.5 (52 squares; v1 count = randint(50,200) x density)", "image": "images/v1/dirt_density_0_5.jpg", "caption": ""}, {"label": "density 1.0", "params": "density_factor=1.0 (104 squares; v1 count = randint(50,200) x density)", "image": "images/v1/dirt_density_1_0.jpg", "caption": ""}, {"label": "density 2.0", "params": "density_factor=2.0 (208 squares; v1 count = randint(50,200) x density)", "image": "images/v1/dirt_density_2_0.jpg", "caption": ""}], "before_after": [{"label": "Dirt specks (2x crop)", "before": "images/v1/dirt_off.png", "after": "images/v1/dirt_on.png", "before_label": "off", "after_label": "on (density 1.0)", "caption": "Hard-edged brown squares, 4-12 px, with a different shade each."}], "notes": "Perfect axis-aligned squares with hard edges, no blur or shading; obviously synthetic when zoomed. Note main.py always uses density_factor 1.0 (the options here are a parameter the code supports but the pipeline never varies)."}, {"id": "rocks", "title": "Rock debris", "summary": "Photographed rocks pasted at random make clutter that is larger than the mines and sometimes similar in shape or colour, so the detector must tell them apart.", "how": "_generate_rocks loads a rock photo, makes an alpha channel with Otsu thresholding (_process_image_otsu), scales it to 40-100 px wide, rotates 0-360 deg and places it anywhere (partly off-screen allowed).", "code": "DatasetGenerator/objects.py: EnvironmentDebris._generate_rocks / _process_image_otsu", "options": [{"label": "5 rocks", "params": "ROCKS_TO_SPAWN_MIN=MAX=5, size 40-100 px, random rotation", "image": "images/v1/rocks_5.jpg", "caption": ""}, {"label": "12 rocks", "params": "ROCKS_TO_SPAWN_MIN=MAX=12, size 40-100 px, random rotation", "image": "images/v1/rocks_12.jpg", "caption": ""}, {"label": "20 rocks", "params": "ROCKS_TO_SPAWN_MIN=MAX=20, size 40-100 px, random rotation", "image": "images/v1/rocks_20.jpg", "caption": ""}, {"label": "Otsu alpha mask", "params": "mask = Otsu threshold of blurred grey rock photo (white = kept)", "image": "images/v1/rocks_mask.png", "caption": "The binary mask that becomes the alpha channel."}], "before_after": [{"label": "Rock debris (crop)", "before": "images/v1/rocks_off.jpg", "after": "images/v1/rocks_on.jpg", "before_label": "off", "after_label": "on (12 rocks)", "caption": "Photographed rocks pasted on the grass at random positions and rotations; there is no shadow under them."}, {"label": "Cutout edge (5x zoom)", "before": "images/v1/rock_edge_raw.png", "after": "images/v1/rock_edge_cut.png", "before_label": "raw photo pasted", "after_label": "Otsu cutout", "caption": "Look at the rim: the cut is a hard 1-bit edge with no feathering, and shadowed parts of the rock can be cut away."}], "notes": "No shadows or ambient-occlusion, so rocks look pasted on. The Otsu cut is a hard 1-bit edge, can cut away pale or shadowed rock parts, and every rock is re-read and re-thresholded from disk each time. Only 15 rock photos."}, {"id": "grass", "title": "Grass clippings", "summary": "Cut-out pieces of real grass photos lie over the ground and partly hide things, imitating blades and leaves on top of the soil.", "how": "_generate_grass_overlays samples 4 grass photos, Otsu-thresholds each, then takes randint(5, GRASS_CLIPPINGS_PER_IMAGE) random 100-300 px crops per photo, scaled to 40-80 px wide and placed at random.", "code": "DatasetGenerator/objects.py: EnvironmentDebris._generate_grass_overlays", "options": [{"label": "cap 5", "params": "GRASS_CLIPPINGS_PER_IMAGE=5 (17 clippings from 4 source photos)", "image": "images/v1/grass_5.jpg", "caption": "Value 4 from the brief is impossible in v1: randint(5, 4) raises ValueError, so 5 is the smallest usable setting."}, {"label": "cap 16", "params": "GRASS_CLIPPINGS_PER_IMAGE=16 (36 clippings from 4 source photos)", "image": "images/v1/grass_16.jpg", "caption": ""}, {"label": "cap 32", "params": "GRASS_CLIPPINGS_PER_IMAGE=32 (61 clippings from 4 source photos)", "image": "images/v1/grass_32.jpg", "caption": ""}], "before_after": [{"label": "Grass clippings (crop)", "before": "images/v1/grass_off.jpg", "after": "images/v1/grass_on.jpg", "before_label": "off", "after_label": "on (cap 16)", "caption": "Cut-out crops of blade photos scattered on the lawn; patches that are mostly background are skipped."}], "notes": "Setting GRASS_CLIPPINGS_PER_IMAGE below 5 crashes (randint(5, n)). Crops are sharp-edged and flat-lit, so they do not match the lighting of the background. Only 5 grass photos."}, {"id": "sprites", "title": "Mine sprites", "summary": "The mines are pre-rendered 3D images (a PFM-1-style scatterable mine) in many poses and shades, so one 3D model yields 50 distinct looks.", "how": "SpriteGenerator renders 50 PNGs with random pitch/roll U(-20,20), yaw U(0,360) and dark-olive colour with a shared brightness shift +-0.3 and +-0.05 jitter. Mine.__init__ picks one, scales it by U(0.1, 0.4) and applies a second random 0-360 deg in-plane rotation.", "code": "DatasetGenerator/objects.py: Mine.__init__ (sprites from SpriteGenerator/generate_sprites.py)", "options": [{"label": "all 50 sprites", "params": "assets/mines/mine_0000..0049.png on mid-grey", "image": "images/v1/sprite_sheet.png", "caption": "Pre-rendered 3D mine renders: pitch/roll in +-20 deg, yaw 0-360, brightness shifts."}, {"label": "scale x rotation grid", "params": "mine_0007.png; scale in [0.1, 0.25, 0.4]; in-plane rotation in [37, 151, 262] deg (rows = scale, cols = rotation)", "image": "images/v1/sprite_scale_rotation.png", "caption": "One sprite placed at the three scales and three in-plane rotations."}], "before_after": [{"label": "Sprite vs placed mine", "before": "images/v1/sprite_flat.png", "after": "images/v1/sprite_placed.png", "before_label": "sprite on grey (scale 0.4)", "after_label": "as placed: rotated 110 deg + dirt, on grass", "caption": "Same sprite; placement adds the second rotation and surface specks. Note the sprite carries its own baked-in lighting."}], "notes": "Only 50 images, one mine model and one colour family. The lighting is baked into each sprite and does not match the background light; the 2D rotation at placement can turn the baked-in light direction the wrong way. Colour/pose values quoted from the generator settings; I did not re-render sprites."}, {"id": "count", "title": "Mine count and placement", "summary": "Each image holds 0-8 mines at random places; empty images teach the detector what 'no mine' looks like.", "how": "main.generate_one_image: 10% of images get 0 mines, otherwise randint(0, 8). Each mine gets up to 50 random positions; a position is rejected if its rectangle touches any earlier mine's rectangle inflated by 10 px. A mine that never fits is dropped.", "code": "DatasetGenerator/main.py: generate_one_image (step 3); objects.py: Mine.set_position, get_yolo_bbox", "options": [{"label": "0 mines", "params": "n_mines=0 (v1: randint(0,8), 10% chance forced to 0), YOLO boxes in green", "image": "images/v1/mines_0.jpg", "caption": ""}, {"label": "1 mines", "params": "n_mines=1 (v1: randint(0,8), 10% chance forced to 0), YOLO boxes in green", "image": "images/v1/mines_1.jpg", "caption": ""}, {"label": "4 mines", "params": "n_mines=4 (v1: randint(0,8), 10% chance forced to 0), YOLO boxes in green", "image": "images/v1/mines_4.jpg", "caption": ""}, {"label": "8 mines", "params": "n_mines=8 (v1: randint(0,8), 10% chance forced to 0), YOLO boxes in green", "image": "images/v1/mines_8.jpg", "caption": ""}], "before_after": [{"label": "Overlap rejection", "before": "images/v1/place_naive.jpg", "after": "images/v1/place_reject.jpg", "before_label": "no check (random positions)", "after_label": "v1 check: rect vs rect inflated by 10 px, up to 50 tries", "caption": "8 mines at scale 0.4 (seed 2). Without the check some boxes overlap; with it each mine is re-rolled until its rectangle is clear. Failures after 50 tries are silently dropped."}], "notes": "Positions are uniform over the frame (edges and corners included), so there is no spatial pattern like real minefields. Overlap is judged on the rotated sprite's rectangle, which is larger than the silhouette. Counting the 10% forced-empty rule plus randint returning 0, about 20% of images have no mine."}, {"id": "minedirt", "title": "Mine surface dirt", "summary": "A few dark dots on top of the mine make its surface less clean and stop it looking like a perfect render.", "how": "Mine._add_surface_dirt draws 5-20 filled circles (radius 1-3, colour (80,60,40) +- 30) at random points that lie on the sprite (alpha \u003e 0 at the centre).", "code": "DatasetGenerator/objects.py: Mine._add_surface_dirt", "options": [{"label": "example 1", "params": "mine_0012.png, scale 0.4, 5-20 circles r=1-3, colour (80,60,40)+-30, 4x nearest zoom", "image": "images/v1/minedirt_ex1.png", "caption": ""}, {"label": "example 2", "params": "mine_0020.png, scale 0.4, 5-20 circles r=1-3, colour (80,60,40)+-30, 4x nearest zoom", "image": "images/v1/minedirt_ex2.png", "caption": ""}, {"label": "example 3", "params": "mine_0033.png, scale 0.4, 5-20 circles r=1-3, colour (80,60,40)+-30, 4x nearest zoom", "image": "images/v1/minedirt_ex3.png", "caption": ""}], "before_after": [{"label": "Surface dirt (4x zoom)", "before": "images/v1/minedirt_off.png", "after": "images/v1/minedirt_on.png", "before_label": "off", "after_label": "on", "caption": "Round, hard-edged dots in one brownish colour family; the pixels near a dot's edge can spill past the silhouette."}], "notes": "Hard-edged dots in a single colour family, with no soil caking, scratches or shading. The sprite mask (used for boxes) is made before the dots are drawn, so dots that spill past the edge are not in the box."}, {"id": "overgrowth", "title": "Overgrowth / occlusion", "summary": "A second layer of debris is drawn after the mines so grass, rocks and dirt can lie on top of them, making some mines partly hidden.", "how": "main.generate_one_image makes a second EnvironmentDebris (dirt + rocks + grass) and draws it after the mines (step 4). The YOLO box was computed earlier from the unoccluded sprite mask.", "code": "DatasetGenerator/main.py: generate_one_image (step 4)", "options": [{"label": "label box vs visible area", "params": "green = v1 YOLO box (from unoccluded sprite mask); red = bounding box of the pixels actually still visible", "image": "images/v1/over_box_vs_visible.png", "caption": "Visible fraction of the silhouette ~64%."}, {"label": "heavy overgrowth", "params": "second layer with dirt density 2, 20 rocks, grass cap 32 (not the v1 default; exaggerated)", "image": "images/v1/over_heavy.png", "caption": "The same mine under a denser second layer."}], "before_after": [{"label": "Occlusion layer", "before": "images/v1/over_off.png", "after": "images/v1/over_on.png", "before_label": "mine, no overgrowth", "after_label": "second debris layer drawn after the mine", "caption": "About 36% of this mine's silhouette is covered (seed 4)."}], "notes": "Boxes ignore occlusion: a mostly-hidden mine still gets its full box, so labels can point at areas with little visible mine. The cover is random, not physical (rock pixels simply overwrite the mine). In this demo the green and red boxes nearly coincide because the rock covers the middle, not the extremities."}, {"id": "shader", "title": "Post-processing shader", "summary": "A final GPU pass degrades the clean render into something more camera-like: grain, colour fringing, darker corners and a little extra contrast.", "how": "main.py runs the 1920x1080 canvas through shaders/post.frag with moderngl: noise (U(0.05,0.12) strength, random time seed), aberration 0.002, vignette 0.4, contrast 1.1. These demos re-run the same shader with the 3 constants exposed as uniforms so each effect can be shown alone.", "code": "DatasetGenerator/shaders/post.frag; main.py: generate_one_image (step 5)", "options": [{"label": "grain 0.05", "params": "noise_strength=0.05 (alone), 4x nearest crop of 200x200", "image": "images/v1/shader_grain_005.png", "caption": "The grain is added to all three channels, then red and blue are overwritten by the aberration step, so only green keeps it."}, {"label": "grain 0.12", "params": "noise_strength=0.12 (alone), 4x nearest crop of 200x200", "image": "images/v1/shader_grain_012.png", "caption": ""}, {"label": "vignette 0.4", "params": "vignette strength 0.4 (alone), full frame", "image": "images/v1/shader_vignette.jpg", "caption": ""}, {"label": "all four together", "params": "noise 0.08 (v1 draws U(0.05,0.12)), aberration 0.002, vignette 0.4, contrast 1.1", "image": "images/v1/shader_all.jpg", "caption": ""}], "before_after": [{"label": "Grain 0.12 (4x crop)", "before": "images/v1/shader_grain_off.png", "after": "images/v1/shader_grain_on.png", "before_label": "off", "after_label": "noise 0.12", "caption": ""}, {"label": "Chromatic aberration (8x crop at a mine edge)", "before": "images/v1/shader_ca_off.png", "after": "images/v1/shader_ca_on.png", "before_label": "off", "after_label": "aberration 0.002 (about 3.8 px)", "caption": "Red is sampled 3.8 px to the right and blue 3.8 px to the left, giving coloured fringes on vertical edges."}, {"label": "Vignette", "before": "images/v1/shader_vig_off.jpg", "after": "images/v1/shader_vig_on.jpg", "before_label": "off", "after_label": "0.4", "caption": "Corners are multiplied by about 0.72; the centre is untouched."}, {"label": "Contrast 1.1", "before": "images/v1/shader_ct_off.jpg", "after": "images/v1/shader_ct_on.jpg", "before_label": "off", "after_label": "1.1", "caption": "A mild push around mid-grey: darks get darker, lights lighter."}, {"label": "All effects", "before": "images/v1/shader_pre.jpg", "after": "images/v1/shader_all2.jpg", "before_label": "pre-shader frame", "after_label": "after full v1 pass", "caption": ""}], "notes": "Bug-like detail: the aberration step overwrites the red and blue channels after the noise is added, so grain only survives in the green channel (greenish speckle). Grain is also only added, never subtracted, so it brightens the image. The texture uses wrap-around sampling, so the left/right 4 px edges mix. Only the strengths of the noise vary per image; the other three effects are fixed. There is no blur, lens distortion, motion blur or compression."}, {"id": "export", "title": "Labels and export", "summary": "Each image gets a text label file of boxes in YOLO format, then the dataset is resized to 640x640 for training.", "how": "main.py writes 'class x_center y_center width height' normalised to 0-1. exportToYOLO.process_dataset resizes with cv2.resize to 640x640 (stretch, no letterbox) and copies the labels unchanged because normalised values are unaffected.", "code": "DatasetGenerator/exportToYOLO.py: process_dataset; calcs.py: normalize_yolo", "options": [{"label": "side by side", "params": "cv2.resize(img,(640,640), INTER_LINEAR); label numbers copied unchanged", "image": "images/v1/export_side_by_side.jpg", "caption": "Left: 1920x1080 with boxes. Right: the 640x640 export (shown at 560 px) with the same normalised boxes redrawn."}, {"label": "1920x1080 source", "params": "full-resolution labels drawn", "image": "images/v1/export_1920.jpg", "caption": ""}, {"label": "640x640 stretched", "params": "640x640, boxes redrawn from the unchanged label file", "image": "images/v1/export_640.png", "caption": ""}], "before_after": [{"label": "Same mine before/after export", "before": "images/v1/export_mine_before.png", "after": "images/v1/export_mine_after.png", "before_label": "1920x1080 (2x view)", "after_label": "640x640 (6x nearest view of the same region)", "caption": "x shrinks by 0.333 (1/3) and y by 0.593, so round things become tall and narrow."}], "notes": "The 16:9 to 1:1 stretch squeezes x by 1/3 and y by 0.59, so mines look tall and narrow and no longer match real camera geometry; a model trained on this sees a distorted shape unless test images are stretched the same way. Single class (0 = mine)."}]}, {"id": "v2", "tab": "v2: new realism features", "title": "v2: realism features of the new generator", "intro": "v2 keeps v1's pipeline (ground photo, clutter, mines, camera) but replaces the parts that made synthetic images easy to spot: mines are rendered from a 3D model with their own pose, colour, shadow, dust, burial and orientation; edges are soft; debris casts consistent shadows; the whole image gets randomised camera effects. Every picture here comes from the v2 code with a fixed seed; before / after pairs use the same seed and change only the named feature, and effects are shown zoomed. Where the effect is weak or imperfect, the notes say so.", "glossary": {"alpha": "Per-pixel opacity: 0 is see-through, 1 is solid. Edge pixels get fractional alpha for soft edges.", "premultiplied alpha": "Colour stored already multiplied by alpha, so blurring or resizing never mixes in the undefined colour of transparent pixels (prevents halos).", "supersampling": "Drawing at several times the resolution and averaging down, which anti-aliases edges.", "penumbra": "The soft transition at the edge of a shadow; wider for low sun and long shadows.", "fBm noise": "Fractal Brownian motion: smooth random noise summed over several scales, used for natural-looking blotches of dust and ragged soil lines.", "soil blending": "Making the mine share the ground's colour and brightness: dust, a darker contact band, soil grains.", "sun azimuth": "Compass direction of the sun in the image: 0 deg = toward the right edge, 90 deg = toward the top. Shadows fall the opposite way.", "sun elevation": "Angle of the sun above the horizon: low = long shadows, high = short ones.", "overcast": "Cloudy, diffuse light: weak, very soft shadows.", "Lambert shading": "Surface brightness proportional to how directly it faces the light.", "ambient occlusion": "Extra darkening where a surface meets the ground and little sky is visible.", "white balance": "Colour cast of a camera: gains on the red and blue channels that make white look neutral.", "gamma": "Non-linear brightness curve; values above 1 darken midtones.", "exposure": "Overall brightness multiplier set by the camera.", "saturation": "How vivid colours are; 0 is grey.", "contrast": "Spread between light and dark parts around mid-grey.", "vignette": "Darkening toward the image corners.", "chromatic aberration": "Colour fringes at edges from a lens focusing colours differently.", "JPEG artifacts": "Blockiness and ringing from lossy compression; lower quality means stronger.", "lens blur / PSF": "Point-spread function: how a camera spreads a point of light; modelled as a Gaussian of sigma px.", "motion blur": "Smear along the direction of camera or object motion during the exposure.", "domain randomisation": "Deliberately varying nuisance factors (lighting, colour, noise, backgrounds) in training data so the model cannot rely on them and generalises to real images.", "pitch / roll / yaw": "Tilt forward-back, tilt side-to-side and rotation about the vertical axis (degrees).", "face down": "A mine lying on its back with its underside toward the camera.", "painter's algorithm": "Drawing triangles from far to near so nearer ones cover farther ones.", "Sutherland-Hodgman": "A method for cutting a polygon against a plane; used to slice the 3D mine at the soil plane.", "berm": "A small lip of disturbed soil along the line where a buried object meets the surface.", "albedo": "The base colour of a surface before lighting.", "HSV": "Hue (colour angle), saturation, value (brightness): a way to describe colour.", "YOLO label": "Text line 'class x_center y_center width height', all as fractions of the image size.", "ablation": "Switching features on or off one at a time to see what each contributes.", "seed": "Number that fixes the random generator so before / after pairs differ only by the feature.", "RGBA cut-out": "An image with a real transparency channel, used for rocks, leaves and dirt snippets."}, "features": [{"id": "mesh_mines", "title": "On-the-fly mine rendering", "flag": "MESH_MINES", "summary": "v1 pasted one of 50 pre-rendered mine pictures, so the detector saw the same 50 shapes and one near-constant colour over and over. v2 draws every mine from the 3D model when the image is made, with its own tilt, rotation, size, colour, lighting and dust, so no two mines are alike. A detector trained on a small pool of look-alike sprites tends to memorise them; real mines in the field never match a fixed pool.", "how": "The STL mesh is rotated (yaw 0-360, pitch/roll mostly small with a thin tail), projected top-down and rasterised triangle by triangle, far to near, at 4x resolution. Lighting is Lambert + specular from the image's sun. Scale uses the same pixels-per-unit as v1 sprites, so MINE_SCALE_MIN/MAX mean the same.", "code": "DatasetGenerator/features/mesh.py: sample_pose, render_mine; objects.py: Mine._render_mesh; assets/mine.stl", "options": [{"label": "grid of 42 v2 mines", "params": "n_mines=8 per image, seeds 100+, default settings (burial excluded)", "image": "images/v2/mesh_grid_42.jpg", "caption": "Each tile is one distinct instance cropped around its box (200 px windows, true relative size). Tag: scale, pitch, roll, yaw in degrees. Colour, size, tilt, light and dust all differ."}, {"label": "v1 for contrast (21 sprites)", "params": "v1=True, n_mines=8 per image", "image": "images/v2/mesh_grid_v1_21.jpg", "caption": "The same kind of grid from v1: sprites from a pool of 50, near-identical dark olive, only the in-plane rotation and size change."}, {"label": "pose distribution (2000 mines)", "params": "features.mesh.sample_pose, TILT_SIGMA=5, TILT_TAIL_PROB=0.05, TILT_CAP=35", "image": "images/v2/mesh_pose_distribution.png", "caption": "Left: histogram of |pitch| and |roll| with median, 90th and 99th percentile. Right: pitch vs roll scatter."}, {"label": "pitch 0, roll 0", "params": "mine_pose=(0, 0, 30), seed 13, scale 0.35", "image": "images/v2/mesh_pose_0_0.png", "caption": "Real 3D tilt: the raised edge catches the light, the low edge goes dark, and the outline changes; a flat rotated picture cannot do this."}, {"label": "pitch 12, roll 0", "params": "mine_pose=(12, 0, 30), seed 13, scale 0.35", "image": "images/v2/mesh_pose_12_0.png", "caption": "Real 3D tilt: the raised edge catches the light, the low edge goes dark, and the outline changes; a flat rotated picture cannot do this."}, {"label": "pitch 20, roll 15", "params": "mine_pose=(20, 15, 30), seed 13, scale 0.35", "image": "images/v2/mesh_pose_20_15.png", "caption": "Real 3D tilt: the raised edge catches the light, the low edge goes dark, and the outline changes; a flat rotated picture cannot do this."}, {"label": "pitch -30, roll 8", "params": "mine_pose=(-30, 8, 30), seed 13, scale 0.35", "image": "images/v2/mesh_pose_m30_8.png", "caption": "Real 3D tilt: the raised edge catches the light, the low edge goes dark, and the outline changes; a flat rotated picture cannot do this."}], "before_after": [{"label": "v1 sprite vs v2 mesh (seed 13)", "before": "images/v2/mesh_ba_a_v1.png", "after": "images/v2/mesh_ba_a_v2.png", "before_label": "v1-style mine", "after_label": "v2 mine", "caption": "Same seed, background, position and size, 4x zoom. Before = the five mine features switched off (sprite, hard edges, hard dots, v1 colour, no shadow) on the v2 background so only the mine differs. v1 is a flat pre-baked picture with hard dots; v2 has smooth shading, a cast shadow, dust and a sun-consistent look."}, {"label": "v1 sprite vs v2 mesh (seed 12)", "before": "images/v2/mesh_ba_b_v1.png", "after": "images/v2/mesh_ba_b_v2.png", "before_label": "v1-style mine", "after_label": "v2 mine", "caption": "Same seed, background, position and size, 4x zoom. Before = the five mine features switched off (sprite, hard edges, hard dots, v1 colour, no shadow) on the v2 background so only the mine differs. v1 is a flat pre-baked picture with hard dots; v2 has smooth shading, a cast shadow, dust and a sun-consistent look."}], "notes": "Flat shading per triangle (the STL is faceted); no self-shadowing between body and wings; no plastic texture or moulding detail; about 35-60 ms per mine. Grid tiles are plain 200 px windows around each mine (not rescaled), so the size differences are real."}, {"id": "soft_edges", "title": "Soft edges and optics (blur)", "flag": "SOFT_EDGES, BLUR", "summary": "v1 enlarged and rotated sprites with nearest-neighbour sampling, giving jagged, hard-edged cut-outs that no real camera produces, and then added no lens blur. v2 draws at 4x size and averages down once (so edges get partial-coverage pixels), feathers rocks and grass, and finally blurs the whole picture with a lens-like kernel (sometimes plus motion blur). Without this the detector can learn 'razor-sharp pasted edge = mine'; real aerial frames are soft and slightly motion-smeared.", "how": "SOFT_EDGES: features/edges.py resize_rotate (area downscale on premultiplied RGBA, one resample, 0.8 px alpha feather on debris, 1 px erosion of Otsu masks). BLUR: features/camera.py apply_blur: Gaussian PSF sigma U(0, 1.5) px, with probability 0.15 a linear motion blur of 1-4 px at a random angle.", "code": "DatasetGenerator/features/edges.py: resize_rotate; features/camera.py: apply_blur; controlPanel: SUPERSAMPLE, DEBRIS_ALPHA_FEATHER, PSF_SIGMA, MOTION_BLUR_PROB, MOTION_BLUR_LENGTH", "options": [{"label": "lens blur sigma 0.0 px", "params": "psf_sigma=0.0, motion_blur_prob=0", "image": "images/v2/blur_psf_0_0.png", "caption": "4x zoom. sigma 0 keeps the anti-aliased edge sharp, 0.7 is mild defocus, 1.5 (top of the sampled range) is clearly soft."}, {"label": "lens blur sigma 0.7 px", "params": "psf_sigma=0.7, motion_blur_prob=0", "image": "images/v2/blur_psf_0_7.png", "caption": "4x zoom. sigma 0 keeps the anti-aliased edge sharp, 0.7 is mild defocus, 1.5 (top of the sampled range) is clearly soft."}, {"label": "lens blur sigma 1.5 px", "params": "psf_sigma=1.5, motion_blur_prob=0", "image": "images/v2/blur_psf_1_5.png", "caption": "4x zoom. sigma 0 keeps the anti-aliased edge sharp, 0.7 is mild defocus, 1.5 (top of the sampled range) is clearly soft."}, {"label": "motion blur 4 px", "params": "psf_sigma=0, motion_blur_prob=1, motion_blur_length=4", "image": "images/v2/blur_motion_4.png", "caption": "A 4 px line-shaped smear at a random angle (the angle is drawn per image); applied to everything, mine and ground alike."}], "before_after": [{"label": "Hard v1-style edge vs soft edge (seed 13)", "before": "images/v2/edges_ba_a_off.png", "after": "images/v2/edges_ba_a_on.png", "before_label": "SOFT_EDGES off", "after_label": "SOFT_EDGES on", "caption": "6x zoom, no lens blur. Off: stair-stepped outline with a coloured fringe; on: the boundary pixels blend part mine, part ground."}, {"label": "Hard v1-style edge vs soft edge (seed 12)", "before": "images/v2/edges_ba_b_off.png", "after": "images/v2/edges_ba_b_on.png", "before_label": "SOFT_EDGES off", "after_label": "SOFT_EDGES on", "caption": "6x zoom, no lens blur. Off: stair-stepped outline with a coloured fringe; on: the boundary pixels blend part mine, part ground."}, {"label": "Lens blur off vs on (psf_sigma 1.2)", "before": "images/v2/blur_ba_off.png", "after": "images/v2/blur_ba_on.png", "before_label": "BLUR off (sigma 0)", "after_label": "BLUR on (sigma 1.2)", "caption": "4x zoom: fine ground texture and the mine's outline lose their crispness."}], "notes": "Blur is spatially uniform (no depth-of-field variation) and motion blur is a straight line. For the edge zoom both images have blur switched off (psf_sigma=0, no motion blur) so you see the raw edge. The 'off' image also turns SOFT_EDGES off only; everything else is identical."}, {"id": "shadows", "title": "Cast shadows", "flag": "SHADOWS", "summary": "v1 had no shadows at all: mines floated on the ground. In v2 each image has one sun (direction, height, strength) and mines, rocks, grass and dirt all cast shadows that agree with it, and mines are shaded by the same light. Shadows are one of the most important real cues for an object lying on the ground. Rocks get shadows too, otherwise 'has a shadow = mine' would become a shortcut.", "how": "features/sun.py samples one sun per image (azimuth, elevation 15-70 deg, strength 0.25-0.65; 15% overcast images with weak, very soft shadows). Mines: the 3D triangles are projected along the sun onto the ground and blurred by a distance-dependent penumbra, plus a little contact darkening. Rocks / grass / dirt: the alpha silhouette is swept away from the sun by height / tan(elevation) and blurred the same way.", "code": "DatasetGenerator/features/sun.py: sample_sun; features/shadows.py: mine_shadow, debris_shadow; objects.py: Mine._draw_shadow, EnvironmentDebris.draw", "options": [{"label": "elevation 15 deg", "params": "sun_elevation=15, sun_azimuth=120, shadow_strength=0.45", "image": "images/v2/shadow_el_15.jpg", "caption": "Same scene, 2x zoom. Low sun: long soft shadows; high sun: short, tight ones under each object."}, {"label": "elevation 35 deg", "params": "sun_elevation=35, sun_azimuth=120, shadow_strength=0.45", "image": "images/v2/shadow_el_35.jpg", "caption": "Same scene, 2x zoom. Low sun: long soft shadows; high sun: short, tight ones under each object."}, {"label": "elevation 70 deg", "params": "sun_elevation=70, sun_azimuth=120, shadow_strength=0.45", "image": "images/v2/shadow_el_70.jpg", "caption": "Same scene, 2x zoom. Low sun: long soft shadows; high sun: short, tight ones under each object."}, {"label": "overcast", "params": "overcast_prob=1 (strength U(0.03, 0.15), penumbra x6)", "image": "images/v2/shadow_overcast.jpg", "caption": "Diffuse light: shadows almost vanish and are very blurry."}, {"label": "azimuth 0 deg", "params": "sun_azimuth=0, sun_elevation=35", "image": "images/v2/shadow_az_0.jpg", "caption": "Shadows of mines and rocks all point away from the arrow; rock photos are also rotated so their baked-in bright side faces the sun."}, {"label": "azimuth 120 deg", "params": "sun_azimuth=120, sun_elevation=35", "image": "images/v2/shadow_az_120.jpg", "caption": "Shadows of mines and rocks all point away from the arrow; rock photos are also rotated so their baked-in bright side faces the sun."}, {"label": "azimuth 240 deg", "params": "sun_azimuth=240, sun_elevation=35", "image": "images/v2/shadow_az_240.jpg", "caption": "Shadows of mines and rocks all point away from the arrow; rock photos are also rotated so their baked-in bright side faces the sun."}, {"label": "strength 0.25", "params": "shadow_strength=0.25, sun_elevation=35, azimuth=120", "image": "images/v2/shadow_str_0_25.jpg", "caption": "Fraction of light removed in shadow (sampled 0.25-0.65 per image)."}, {"label": "strength 0.45", "params": "shadow_strength=0.45, sun_elevation=35, azimuth=120", "image": "images/v2/shadow_str_0_45.jpg", "caption": "Fraction of light removed in shadow (sampled 0.25-0.65 per image)."}, {"label": "strength 0.65", "params": "shadow_strength=0.65, sun_elevation=35, azimuth=120", "image": "images/v2/shadow_str_0_65.jpg", "caption": "Fraction of light removed in shadow (sampled 0.25-0.65 per image)."}], "before_after": [{"label": "Mines: shadows off / on", "before": "images/v2/shadow_ba_mine_off.png", "after": "images/v2/shadow_ba_mine_on.png", "before_label": "SHADOWS off", "after_label": "SHADOWS on", "caption": "4x zoom on the middle mine. With shadows the mine sits on the ground, has a lit and a dark side and a soft shadow."}, {"label": "Whole region: mines and rocks", "before": "images/v2/shadow_ba_rocks_off.jpg", "after": "images/v2/shadow_ba_rocks_on.jpg", "before_label": "SHADOWS off", "after_label": "SHADOWS on", "caption": "2x zoom. Rocks, leaf litter and the mines all gain shadows falling the same way (away from the arrow), so the debris is consistent with the sun that lights the mines."}, {"label": "A single rock: shadow off / on", "before": "images/v2/shadow_ba_rock1_off.png", "after": "images/v2/shadow_ba_rock1_on.png", "before_label": "SHADOWS off", "after_label": "SHADOWS on", "caption": "6x zoom on a rock: the shadow is a swept, blurred copy of its outline, away from the sun."}], "notes": "No self-shadowing on the mine (wings do not shade the body). The background photos have their own baked-in shadows in arbitrary directions, which can contradict the synthetic sun. Mine shadows fall on a flat plane, not over rocks or grass relief. PFM-1 mines are thin, so their shadows are short (physically right). Rocks keep their rotation (rock_align_light=False) so only the shadows differ between off and on. Arrow overlay: points toward the sun; shadows fall the opposite way. Azimuth 0 = sun toward image right, 90 = toward image top."}, {"id": "rock_seating", "title": "Rock and debris seating (contact shadows)", "flag": "SHADOWS (ROCK_CONTACT_SHADOW, ROCK_CAST_SHADOW, ROCK_RIM_BLEND)", "summary": "A pasted rock cut-out looks like a sticker unless it appears to touch the ground. v2 adds a soft contact shadow right under rocks, dirt clods and leaf clumps, a sun-direction cast shadow, and a rim blend that tints the rock edge toward the local ground and darkens the side away from the sun. Mines already had such cues; without them on the clutter, 'seated and shadowed = mine' would be a shortcut for the detector.", "how": "debris_shadow: contact shadow = dilated, blurred alpha shifted slightly away from the sun, darkening 20-50% scaled by the image's shadow strength; cast shadow = swept silhouette with capped length; rim blend = 1.5 px edge tinted toward the ground, darker on the shadow side. Rocks are otherwise rotated so their baked-in bright side faces the sun; these comparisons set rock_align_light=False so rotation is identical across variants.", "code": "DatasetGenerator/features/shadows.py: debris_shadow; objects.py: EnvironmentDebris.draw; controlPanel: ROCK_CONTACT_SHADOW, ROCK_CAST_SHADOW, ROCK_RIM_BLEND, ROCK_CONTACT_*, ROCK_HEIGHT_FRAC", "options": [{"label": "shadows off", "params": "shadows=False", "image": "images/v2/rock_opt_0.png", "caption": "6x zoom on one rock; same rock, same rotation."}, {"label": "contact shadow only", "params": "rock_cast_shadow=False", "image": "images/v2/rock_opt_1.png", "caption": "6x zoom on one rock; same rock, same rotation."}, {"label": "full, sun 18 deg", "params": "sun_elevation=18", "image": "images/v2/rock_opt_2.png", "caption": "6x zoom on one rock; same rock, same rotation."}, {"label": "full, sun 35 deg", "params": "sun_elevation=35", "image": "images/v2/rock_opt_3.png", "caption": "6x zoom on one rock; same rock, same rotation."}, {"label": "full, sun 65 deg", "params": "sun_elevation=65", "image": "images/v2/rock_opt_4.png", "caption": "6x zoom on one rock; same rock, same rotation."}], "before_after": [{"label": "Rock 1: no shadows vs full", "before": "images/v2/rock_ba0_off.png", "after": "images/v2/rock_ba0_on.png", "before_label": "SHADOWS off", "after_label": "contact + cast + rim", "caption": "6x zoom, sun elevation 35: the rock sits on the ground instead of floating."}, {"label": "Rock 1: contact only vs full", "before": "images/v2/rock_ba0_contact.png", "after": "images/v2/rock_ba0_full.png", "before_label": "contact shadow only", "after_label": "contact + cast", "caption": "Adding the sun-direction cast shadow on top of the contact shadow."}, {"label": "Rock 2: no shadows vs full", "before": "images/v2/rock_ba1_off.png", "after": "images/v2/rock_ba1_on.png", "before_label": "SHADOWS off", "after_label": "contact + cast + rim", "caption": "6x zoom, sun elevation 35: the rock sits on the ground instead of floating."}, {"label": "Rock 2: contact only vs full", "before": "images/v2/rock_ba1_contact.png", "after": "images/v2/rock_ba1_full.png", "before_label": "contact shadow only", "after_label": "contact + cast", "caption": "Adding the sun-direction cast shadow on top of the contact shadow."}], "notes": "On this busy grass background the shadow is hard to see at 35-65 deg elevation (best at 18 deg, where the dark side of the rock and the shadow edge show); on pale ground the effect is clearer. The shadows are 2D approximations (swept silhouettes) and the rock photos have their own baked-in lighting, so a rock can still look flat or lit from a different side, especially with rock_align_light off. Contact shadow is weaker in overcast images. Seed 30 with leaf clumps and blades off to keep the rock clear; azimuth 120 deg in every image (arrow overlay shows sun direction)."}, {"id": "soil_blend", "title": "Soil blending", "flag": "SOIL_BLEND", "summary": "In v1 the mine sprite was pasted with a clean outline and a few hard-edged brown dots. In reality a mine lying in the field is dusty, partly coated with the local soil, darker where it touches the ground and shares the scene's exposure. v2 adds a noisy dust layer in the local ground colour, a darker contact band, soft soil grains and matches the mine's brightness to its surroundings. This removes the 'clean sticker on a photo' look.", "how": "soil.soil_blend samples the composite under the mine: (a) exposure harmonisation, (b) dust layer coloured by the blurred local ground, with opacity from fBm noise, (c) 1.5-4 px contact band inside the edge, darker and dustier, (d) thresholded-noise soil grains 0-5% of the mine, local colour. Ground dirt squares also become soft, tinted irregular grains (soil.dirt_grain).", "code": "DatasetGenerator/features/soil.py: soil_blend, dirt_grain; objects.py: Mine.draw; controlPanel: DUST_STRENGTH, CONTACT_BAND_*, GRAIN_*", "options": [{"label": "blend off (v1 look)", "params": "soil_blend=False", "image": "images/v2/soil_opt_off.png", "caption": "5x zoom: clean paste with hard dots."}, {"label": "0% (blend on, no dust)", "params": "soil_blend=True, dust_strength=0 (grain_density=0.03)", "image": "images/v2/soil_dust_0.png", "caption": "Contact band, grains and exposure matching only; no dust layer."}, {"label": "dust 25%", "params": "dust_strength=0.25 (grain_density=0.03)", "image": "images/v2/soil_dust_25.png", "caption": "Dust opacity ceiling (before the fBm noise modulates it). The sampler now draws it per mine from a triangle: low 0.25, mode 0.30, high 0.50 (mean 0.35)."}, {"label": "dust 35%", "params": "dust_strength=0.35 (grain_density=0.03)", "image": "images/v2/soil_dust_35.png", "caption": "Dust opacity ceiling (before the fBm noise modulates it). The sampler now draws it per mine from a triangle: low 0.25, mode 0.30, high 0.50 (mean 0.35)."}, {"label": "dust 50%", "params": "dust_strength=0.5 (grain_density=0.03)", "image": "images/v2/soil_dust_50.png", "caption": "Dust opacity ceiling (before the fBm noise modulates it). The sampler now draws it per mine from a triangle: low 0.25, mode 0.30, high 0.50 (mean 0.35)."}], "before_after": [{"label": "Soil blending off / on (seed 13)", "before": "images/v2/soil_ba_a_off.png", "after": "images/v2/soil_ba_a_on.png", "before_label": "SOIL_BLEND off (hard dots)", "after_label": "SOIL_BLEND on", "caption": "8x zoom (no lens blur). Look at the contact band at the edge, the blotchy dust that picks up the ground colour, and the grains that replace v1's round dots."}, {"label": "Soil blending off / on (seed 12)", "before": "images/v2/soil_ba_b_off.png", "after": "images/v2/soil_ba_b_on.png", "before_label": "SOIL_BLEND off (hard dots)", "after_label": "SOIL_BLEND on", "caption": "8x zoom (no lens blur). Look at the contact band at the edge, the blotchy dust that picks up the ground colour, and the grains that replace v1's round dots."}], "notes": "Dust is a 2D overlay (no accumulation in crevices) and there is no wetness or mud. Default dust is drawn per mine from a triangular distribution (0.25 / 0.30 / 0.50, mean 0.35). With dust 0 the contact band, grains and exposure matching are still active. In the strength images grain density is fixed at 3% so that only the dust differs."}, {"id": "burial", "title": "Partial burial", "flag": "BURIAL", "summary": "Real mines are often half-sunk in soil, so only part of the body shows. In v1 every mine was whole and sitting on top. In v2 35% of mines are buried: a soil plane (tilted up to 25 deg) hides a chosen fraction of the mine, with a rough soil line and a small soil lip along it. The label box covers only the part that is still visible. This teaches the detector to find mines from a fragment (a wing, an edge) rather than only from the complete outline.", "how": "features/mesh.py: the soil plane offset is the burial-fraction quantile of the surface heights, so the hidden fraction of the top-down area is hit exactly; the 3D triangles are clipped against the plane (Sutherland-Hodgman) and the shadow is projected onto the same plane. soil.burial_overlay adds an fBm-roughened soil line and a berm (lip) in the local ground colour. The hidden fraction is capped at 50% (BURIAL_MAX_FRACTION); the achieved fraction is stored in the sidecar.", "code": "DatasetGenerator/features/mesh.py: sample_burial, clip_triangles, render_mine; features/soil.py: burial_overlay; controlPanel: BURIAL_PROB, BURIAL_FRACTION, BURIAL_MAX_FRACTION, BURIAL_TILT, BERM_*", "options": [{"label": "hidden 0%", "params": "burial_prob=0", "image": "images/v2/burial_frac_0.png", "caption": "Green box = YOLO label from the visible part. 0.5 is the cap: at least half the mine always stays visible."}, {"label": "hidden 20%", "params": "burial_prob=1, burial_fraction=0.2, burial_tilt=12 (achieved 0.28)", "image": "images/v2/burial_frac_20.png", "caption": "Green box = YOLO label from the visible part. 0.5 is the cap: at least half the mine always stays visible."}, {"label": "hidden 35%", "params": "burial_prob=1, burial_fraction=0.35, burial_tilt=12 (achieved 0.43)", "image": "images/v2/burial_frac_35.png", "caption": "Green box = YOLO label from the visible part. 0.5 is the cap: at least half the mine always stays visible."}, {"label": "hidden 50%", "params": "burial_prob=1, burial_fraction=0.5, burial_tilt=12 (achieved 0.55)", "image": "images/v2/burial_frac_50.png", "caption": "Green box = YOLO label from the visible part. 0.5 is the cap: at least half the mine always stays visible."}, {"label": "plane tilt 0 deg", "params": "burial_fraction=0.35, burial_tilt=0", "image": "images/v2/burial_tilt_0.png", "caption": "Tilt of the buried soil plane (its direction is random but fixed for the seed): the soil line runs at a different angle and the shadow lies on the tilted plane."}, {"label": "plane tilt 12 deg", "params": "burial_fraction=0.35, burial_tilt=12", "image": "images/v2/burial_tilt_12.png", "caption": "Tilt of the buried soil plane (its direction is random but fixed for the seed): the soil line runs at a different angle and the shadow lies on the tilted plane."}, {"label": "plane tilt 25 deg", "params": "burial_fraction=0.35, burial_tilt=25", "image": "images/v2/burial_tilt_25.png", "caption": "Tilt of the buried soil plane (its direction is random but fixed for the seed): the soil line runs at a different angle and the shadow lies on the tilted plane."}], "before_after": [{"label": "Not buried vs 40% buried (seed 13)", "before": "images/v2/burial_ba_a_off.png", "after": "images/v2/burial_ba_a_on.png", "before_label": "BURIAL off", "after_label": "40% buried", "caption": "4x zoom, same mine, pose and position. The box shrinks to the visible part (green). Achieved hidden fraction 0.48."}, {"label": "Not buried vs 40% buried (seed 12)", "before": "images/v2/burial_ba_b_off.png", "after": "images/v2/burial_ba_b_on.png", "before_label": "BURIAL off", "after_label": "40% buried", "caption": "4x zoom, same mine, pose and position. The box shrinks to the visible part (green). Achieved hidden fraction 0.45."}], "notes": "The soil plane is a plane (no local relief) and no soil is spilled onto the wings away from the line. The soil lip lies only along the true soil line and is tinted like the local ground, so it is subtle: the main cue is the missing part of the mine and the shrunken box (the earlier 1-2 px leftover outline is fixed, and the mine no longer shifts between burial off and on). The hidden fraction is the target; the soil-line roughness can add a few percent (achieved is capped at 50%). Boxes are drawn in green on every image below."}, {"id": "colour", "title": "Colour palette", "flag": "COLOUR_PALETTE", "summary": "v1 painted every mine the same dark olive-teal with tiny jitter, so colour alone told a detector 'mine'. v2 draws each mine's colour from realistic military-plastic families (olive drab, dark green, khaki, brown, tan), then adds sun-bleaching, a dirt tint and a brightness factor, so hue and brightness cover the real range and no single colour is a shortcut. Colours outside realistic plastics (blue, red...) are deliberately excluded.", "how": "features/colour.py: family by weight (olive 0.28, dark green 0.22, brown 0.20, khaki 0.15, tan 0.15), H, S, V uniform inside the family's range; with p=0.35 bleaching (S down, V up); with p=0.4 mix towards a dirt colour by up to 30%; brightness x U(0.85, 1.15). The result is the albedo that the scene lighting then shades.", "code": "DatasetGenerator/features/colour.py: sample_colour_params, colour_from_params; controlPanel: PALETTE, BLEACH_*, DIRT_TINT_*, BRIGHTNESS_JITTER", "options": [{"label": "60 sampled colours, same background", "params": "mine_colour = colour_from_params(sample_colour_params(...)), 60 draws, seed 13, scale 0.28", "image": "images/v2/colour_sheet_60.jpg", "caption": "Tag: family; b = sun-bleached, d = dirt-tinted. Everything else (ground, position, pose, lighting) is identical, only the albedo changes."}, {"label": "by family (7 samples each)", "params": "rows: olive_drab, dark_green, khaki, brown, tan", "image": "images/v2/colour_families.jpg", "caption": "Each row is one family, with its internal spread."}, {"label": "v1 colour for contrast (10 draws)", "params": "v1 formula: base RGB (0.15, 0.38, 0.27) + common shift U(-0.3, 0.3) + per-channel U(-0.05, 0.05)", "image": "images/v2/colour_v1_10.jpg", "caption": "v1's colour formula: always the same teal-green hue, only lighter or darker."}], "before_after": [{"label": "v1 colour vs palette (seed 13)", "before": "images/v2/colour_ba_a_v1.png", "after": "images/v2/colour_ba_a_v2.png", "before_label": "COLOUR_PALETTE off", "after_label": "palette (olive_drab)", "caption": "4x zoom. Same mine and scene, only the albedo is drawn differently."}, {"label": "v1 colour vs palette (seed 12)", "before": "images/v2/colour_ba_b_v1.png", "after": "images/v2/colour_ba_b_v2.png", "before_label": "COLOUR_PALETTE off", "after_label": "palette (tan)", "caption": "4x zoom. Same mine and scene, only the albedo is drawn differently."}], "notes": "Whether this palette matches real PFM-1 / field colours should be checked against reference photos; the ranges are a judgement call (arbitrary hues were excluded by decision). Each swatch is the same background and position, with the lighting and shading of that scene."}, {"id": "photometric", "title": "Photometric jitter and background augmentation", "flag": "PHOTOMETRIC_JITTER, BG_AUGMENT", "summary": "Real footage varies with camera exposure, white balance, sensor noise, JPEG quality and lens vignetting, and with the ground it flies over. v1 applied almost the same grain, colour fringe, vignette and contrast to every image, and gave the background only a small zoom. v2 randomises all of these per image (domain randomisation: deliberately varying nuisance factors so the detector cannot rely on them), and flips, rotates, zooms and colour-shifts the background photo.", "how": "features/camera.py sample_camera_params / apply_camera: exposure 0.75-1.25, gamma 0.85-1.15, red and blue white-balance gains 0.92-1.08, saturation 0.75-1.25, contrast 0.95-1.2, zero-mean Gaussian noise sigma 0-0.025 (0-50% colour), chromatic aberration up to 0.2% of width, vignette 0-0.5, JPEG quality 70-95. features/background.py: flips, 90-degree rotations, zoom 1-2, hue +-8 deg, saturation / brightness 0.8-1.2, channel gains 0.95-1.05.", "code": "DatasetGenerator/features/camera.py: sample_camera_params, apply_camera, jpeg_roundtrip; features/background.py: sample_background_params, make_background; fx.py: photometric", "options": [{"label": "exposure 0.75 (dark)", "params": "camera dict: exposure=0.75 (others neutral)", "image": "images/v2/jitter_0_exposure.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "exposure 1.25 (bright)", "params": "camera dict: exposure=1.25 (others neutral)", "image": "images/v2/jitter_1_exposure.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "gamma 1.15", "params": "camera dict: gamma=1.15 (others neutral)", "image": "images/v2/jitter_2_gamma.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "white balance R 1.08 / B 0.92 (warm)", "params": "camera dict: wb_r=1.08, wb_b=0.92 (others neutral)", "image": "images/v2/jitter_3_wb_r.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "white balance R 0.92 / B 1.08 (cool)", "params": "camera dict: wb_r=0.92, wb_b=1.08 (others neutral)", "image": "images/v2/jitter_4_wb_r.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "saturation 0.75 (washed out)", "params": "camera dict: saturation=0.75 (others neutral)", "image": "images/v2/jitter_5_saturation.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "saturation 1.25", "params": "camera dict: saturation=1.25 (others neutral)", "image": "images/v2/jitter_6_saturation.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "contrast 1.2", "params": "camera dict: contrast=1.2 (others neutral)", "image": "images/v2/jitter_7_contrast.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "sensor noise sigma 0.025", "params": "camera dict: noise_sigma=0.025, noise_chroma=0.5 (others neutral)", "image": "images/v2/jitter_8_noise_sigma.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "JPEG quality 70", "params": "camera dict: jpeg_quality=70 (others neutral)", "image": "images/v2/jitter_9_jpeg_quality.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "vignette 0.5", "params": "camera dict: vignette=0.5 (others neutral)", "image": "images/v2/jitter_10_vignette.jpg", "caption": "2x zoom of the same scene; one parameter pushed to the end of its sampled range."}, {"label": "background: off (reference)", "params": "bg_augment=False", "image": "images/v2/bgaug_0.jpg", "caption": "Background photo only (no mines), photometric jitter off."}, {"label": "background: horizontal flip", "params": "bg_flip_prob=1.0, bg_rot90_prob=0.0, bg_zoom=1.0", "image": "images/v2/bgaug_1.jpg", "caption": "Background photo only (no mines), photometric jitter off."}, {"label": "background: rotate 90 + zoom 1.8", "params": "bg_flip_prob=0.0, bg_rot90_prob=1.0, bg_zoom=1.8", "image": "images/v2/bgaug_2.jpg", "caption": "Background photo only (no mines), photometric jitter off."}, {"label": "background: colour jitter hue +8, sat 1.2, brightness 1.2", "params": "bg_flip_prob=0, bg_rot90_prob=0, bg_zoom=1.0, bg_hue_shift=8.0, bg_saturation=1.2, bg_brightness=1.2", "image": "images/v2/bgaug_3.jpg", "caption": "Background photo only (no mines), photometric jitter off."}], "before_after": [{"label": "v1 shader vs photometric jitter (seed 13)", "before": "images/v2/photo_ba_a_off.jpg", "after": "images/v2/photo_ba_a_on.jpg", "before_label": "PHOTOMETRIC_JITTER off (v1 shader)", "after_label": "on", "caption": "2x zoom. Off: v1's fixed grain / 3.8 px colour fringe / vignette / contrast / JPEG 85. On (this draw): exposure 0.76, gamma 0.91, saturation 0.92, noise 0.001, vignette 0.23, JPEG 74."}, {"label": "v1 shader vs photometric jitter (seed 8)", "before": "images/v2/photo_ba_b_off.jpg", "after": "images/v2/photo_ba_b_on.jpg", "before_label": "PHOTOMETRIC_JITTER off (v1 shader)", "after_label": "on", "caption": "2x zoom. Off: v1's fixed grain / 3.8 px colour fringe / vignette / contrast / JPEG 85. On (this draw): exposure 1.24, gamma 0.99, saturation 1.04, noise 0.019, vignette 0.17, JPEG 84."}, {"label": "Background augmentation off / on", "before": "images/v2/bgaug_ba_off.jpg", "after": "images/v2/bgaug_ba_on.jpg", "before_label": "BG_AUGMENT off", "after_label": "BG_AUGMENT on", "caption": "Same scene (mines at identical positions); the background photo is flipped / rotated / zoomed / recoloured."}], "notes": "No sensor-specific noise model (Poisson noise, banding); colour jitter is global per image, not per region. The eight jitter images below are the same scene with hand-picked, deliberately strong values (taken from the edges of the sampled ranges) so the effect is visible; real draws are usually milder. They are produced by temporarily substituting the sampled camera dict in the showcase script (the generator is untouched). JPEG q shown is applied via jpeg_roundtrip."}, {"id": "assets", "title": "New assets and sampling", "flag": "NEW_ASSETS, GRASS_BLADES", "summary": "v1 drew from 15 background photos, a handful of rock and grass photos and flat coloured dirt squares. v2 adds many more backgrounds (indexed by family, e.g. grass vs non-grass), 34 transparent rock cut-outs, a separate layer of leaf-litter clumps (2-10 per image, desaturated and tinted towards the ground), soft dirt/dust snippets and a layer of thin grass blades, tufts and wisps that lie under and over the mines (the overgrowth partly hides mines and is counted in the labels). More varied clutter and ground means the detector cannot tie 'mine' to the few textures it saw in v1.", "how": "features/assets.py picks a source folder by weight, then a file; RGBA PNGs use their real alpha (no Otsu cut-out). features/background.py reads assets_new/backgrounds_index.json when BG_USE_INDEX is on. features/blades.py makes blades / tufts / wisps (about half generated on the fly, half from assets_new/grassBlades), sized in millimetres via the scene's px-per-mm.", "code": "DatasetGenerator/features/assets.py: sources, pick_file, load_cutout; features/background.py: pick_background; features/blades.py: make_blade_elements; objects.py: EnvironmentDebris; controlPanel: BACKGROUND_SOURCES, ROCK_SOURCES, GRASS_SOURCES, DIRT_SOURCES, GRASS_BLADES, BLADES_*", "options": [{"label": "asset contact sheet", "params": "docs/showcase/images/assets_contact_sheet.jpg", "image": "images/assets_contact_sheet.jpg", "caption": "Backgrounds, rocks, leaf litter, dirt snippets and grass blades available to the sampler (sheet produced by the assets agent)."}, {"label": "new-asset scene: w/backgrounds/bg_Ground005.jpg", "params": "seed 7, 3 mines, defaults", "image": "images/v2/assets_scene_7.jpg", "caption": "2x zoom: new ground, rocks, leaf litter, soil snippets and grass blades around the mines."}, {"label": "new-asset scene: w/backgrounds/bg_Ground005.jpg", "params": "seed 16, 3 mines, defaults", "image": "images/v2/assets_scene_16.jpg", "caption": "2x zoom: new ground, rocks, leaf litter, soil snippets and grass blades around the mines."}, {"label": "new-asset scene: g_gen_02_grass_fresh_mowed.jpg", "params": "seed 12, 3 mines, defaults", "image": "images/v2/assets_scene_12.jpg", "caption": "2x zoom: new ground, rocks, leaf litter, soil snippets and grass blades around the mines."}, {"label": "blade length 40 mm", "params": "grass_blades=True, blades_under=60, blades_over=0, blade_size_mm=40.0", "image": "images/v2/blades_size_40.jpg", "caption": "2x zoom, 60 blades under the mines. Length is in millimetres and converted with the scene's px/mm, so blades are a few px wide."}, {"label": "blade length 100 mm", "params": "grass_blades=True, blades_under=60, blades_over=0, blade_size_mm=100.0", "image": "images/v2/blades_size_100.jpg", "caption": "2x zoom, 60 blades under the mines. Length is in millimetres and converted with the scene's px/mm, so blades are a few px wide."}, {"label": "blade length 160 mm", "params": "grass_blades=True, blades_under=60, blades_over=0, blade_size_mm=160.0", "image": "images/v2/blades_size_160.jpg", "caption": "2x zoom, 60 blades under the mines. Length is in millimetres and converted with the scene's px/mm, so blades are a few px wide."}, {"label": "blades under the mines (60)", "params": "blades_under=60, blades_over=0", "image": "images/v2/blades_under_60.jpg", "caption": "Blades drawn before the mines; the mines lie on top of them."}, {"label": "blades on each mine: probability 0.0", "params": "blades_over_on_mine=0.0, blades_on_mine_count=3 (default 1-4)", "image": "images/v2/blades_onmine_0_0.jpg", "caption": "2x zoom, three mines. BLADES_OVER_ON_MINE is the per-mine chance of extra over-layer blades centred on the mine's box (expanded 20%), so they cross the mine."}, {"label": "blades on each mine: probability 0.6", "params": "blades_over_on_mine=0.6, blades_on_mine_count=3 (default 1-4)", "image": "images/v2/blades_onmine_0_6.jpg", "caption": "2x zoom, three mines. BLADES_OVER_ON_MINE is the per-mine chance of extra over-layer blades centred on the mine's box (expanded 20%), so they cross the mine."}, {"label": "blades on each mine: probability 1.0", "params": "blades_over_on_mine=1.0, blades_on_mine_count=3 (default 1-4)", "image": "images/v2/blades_onmine_1_0.jpg", "caption": "2x zoom, three mines. BLADES_OVER_ON_MINE is the per-mine chance of extra over-layer blades centred on the mine's box (expanded 20%), so they cross the mine."}], "before_after": [{"label": "v1 assets only vs new assets (seed 3)", "before": "images/v2/assets_ba_a_off.jpg", "after": "images/v2/assets_ba_a_on.jpg", "before_label": "NEW_ASSETS off (v1 set)", "after_label": "on", "caption": "2x zoom. The background photo is drawn from a different pool (same random stream), so the ground may differ, plus the new rock / leaf / dirt layers."}, {"label": "v1 assets only vs new assets (seed 7)", "before": "images/v2/assets_ba_b_off.jpg", "after": "images/v2/assets_ba_b_on.jpg", "before_label": "NEW_ASSETS off (v1 set)", "after_label": "on", "caption": "2x zoom. The background photo is drawn from a different pool (same random stream), so the ground may differ, plus the new rock / leaf / dirt layers."}, {"label": "Grass blades off / on (seed 7)", "before": "images/v2/blades_ba_a_off.jpg", "after": "images/v2/blades_ba_a_on.jpg", "before_label": "GRASS_BLADES off", "after_label": "on", "caption": "2x zoom. Thin blades, tufts and wisps lie under and over the mines; blades over a mine hide part of it."}, {"label": "Grass blades off / on (seed 16)", "before": "images/v2/blades_ba_b_off.jpg", "after": "images/v2/blades_ba_b_on.jpg", "before_label": "GRASS_BLADES off", "after_label": "on", "caption": "2x zoom. Thin blades, tufts and wisps lie under and over the mines; blades over a mine hide part of it."}, {"label": "Blades crossing a mine: 0 vs 1.0 (seed 7)", "before": "images/v2/blades_ba_a_off.png", "after": "images/v2/blades_ba_a_on.png", "before_label": "blades_over_on_mine=0", "after_label": "blades_over_on_mine=1.0 (3 blades)", "caption": "6x zoom on the middle mine, same seed. Blades lie over the mine and hide part of it; the visible-mask label shrinks accordingly."}, {"label": "Blades crossing a mine: 0 vs 1.0 (seed 16)", "before": "images/v2/blades_ba_b_off.png", "after": "images/v2/blades_ba_b_on.png", "before_label": "blades_over_on_mine=0", "after_label": "blades_over_on_mine=1.0 (3 blades)", "caption": "6x zoom on the middle mine, same seed. Blades lie over the mine and hide part of it; the visible-mask label shrinks accordingly."}], "notes": "Assets are CC0 close-up textures (ambientCG, see assets_new/ATTRIBUTION.md), not true aerial photos: scale, perspective and baked-in shadows differ from the v1 photos. Leaf clumps are now desaturated and ground-tinted, which looks more natural than the earlier garish yellow/orange, but they are still visibly pasted textures; rock cut-outs have no baked shadow but receive the synthetic one. The contact sheet is owned by another agent and may be updated."}, {"id": "asset_audit", "title": "Asset audit and filter", "flag": "ASSET_AUDIT_FILTER", "summary": "Before using the extra images for training, every background, rock, leaf, dirt and grass image was checked individually (186 audited). Some of the original v1 backgrounds turned out to be screenshots with stock-photo watermarks or other flaws; a detector could learn such marks as a shortcut. The audit's exclusion list is applied when the generator samples assets, and 'review' items are drawn less often.", "how": "features/assets.py and features/background.py read docs/asset_audit/exclude.json by file name: 'hard_exclude' files are never sampled; 'review' files (69) get weight x0.4 (ASSET_REVIEW_WEIGHT). v1 mode (flag off) reproduces v1 exactly, watermarks included. The sidecar records the audit status of the background.", "code": "DatasetGenerator/features/assets.py, features/background.py; docs/asset_audit/ (exclude.json, summary.csv, flagged_sheet.py); controlPanel: ASSET_AUDIT_FILTER, ASSET_AUDIT_PATH, ASSET_REVIEW_WEIGHT", "options": [{"label": "flagged assets", "params": "docs/asset_audit/flagged_assets.jpg", "image": "images/v2/asset_audit_flagged.jpg", "caption": "Contact sheet of the flagged assets (sheet produced by the audit)."}], "before_after": [{"label": "Filter off vs on (seed 1)", "before": "images/v2/audit_ba_0_off.jpg", "after": "images/v2/audit_ba_0_on.jpg", "before_label": "ASSET_AUDIT_FILTER off", "after_label": "on", "caption": "With the filter off, seed 1 draws a hard-excluded background (Screenshot 2026-02-07 at 4.2); with it on a different, clean photo is used. The excluded photo carries a faint stock-photo watermark (ghost spiral marks near the centre of the first example)."}, {"label": "Filter off vs on (seed 23)", "before": "images/v2/audit_ba_1_off.jpg", "after": "images/v2/audit_ba_1_on.jpg", "before_label": "ASSET_AUDIT_FILTER off", "after_label": "on", "caption": "With the filter off, seed 23 draws a hard-excluded background (Screenshot 2026-02-07 at 4.2); with it on a different, clean photo is used. The excluded photo carries a faint stock-photo watermark (ghost spiral marks near the centre of the first example)."}], "notes": "Findings: 186 images audited individually; 6 of the 15 v1 backgrounds and 2 of the 5 v1 grass snippets (debris1, debris2) are hard-excluded; no watermarks were found in the new assets (assets_new was cleaned: 17 backgrounds rejected, rocks / leaf clumps / dirt regenerated or defringed, six real-grass backgrounds added). The exclusion list is an auditor opinion and was meant to be spot-checked. After filtering, 9 of the 15 v1 photos remain. All images on this page use the current, filtered asset pool."}, {"id": "labels", "title": "Label policy (visible-mask boxes)", "flag": "LABEL_VISIBLE_MASK", "summary": "v1 drew the label box around the mine as it would look unobstructed, even when rocks, grass or soil covered part of it, so the box could include things the camera cannot see. v2 builds the box from the pixels of the mine that are actually visible after burial soil and the overgrowth layer. That matches what a human annotator would draw on a real photo.", "how": "Mine.label: with LABEL_VISIBLE_MASK the visible mask = mine alpha after burial soil, minus accumulated overgrowth alpha; box = bounding box of pixels with alpha \u003e 0.5. A mine with fewer than LABEL_MIN_VISIBLE_PX (default 1) visible pixels gets no box.", "code": "DatasetGenerator/objects.py: Mine.label; scene.py (occlusion buffer); controlPanel: LABEL_VISIBLE_MASK, LABEL_ALPHA_THRESHOLD, LABEL_MIN_VISIBLE_PX", "options": [], "before_after": [{"label": "Partly covered mine, seed 221 #3 (box area x0.59)", "before": "images/v2/label_ba_0_off.png", "after": "images/v2/label_ba_0_on.png", "before_label": "mask off: v1 box (red)", "after_label": "mask on: visible-part box (green)", "caption": "3x zoom. Same pixels in both images; the red box (v1 policy) includes the covered part of the mine, the green one hugs what is visible."}, {"label": "Partly covered mine, seed 201 #4 (box area x0.62)", "before": "images/v2/label_ba_1_off.png", "after": "images/v2/label_ba_1_on.png", "before_label": "mask off: v1 box (red)", "after_label": "mask on: visible-part box (green)", "caption": "3x zoom. Same pixels in both images; the red box (v1 policy) includes the covered part of the mine, the green one hugs what is visible."}, {"label": "Partly covered mine, seed 204 #2 (box area x0.70)", "before": "images/v2/label_ba_2_off.png", "after": "images/v2/label_ba_2_on.png", "before_label": "mask off: v1 box (red)", "after_label": "mask on: visible-part box (green)", "caption": "3x zoom. Same pixels in both images; the red box (v1 policy) includes the covered part of the mine, the green one hugs what is visible."}, {"label": "Half-buried mine", "before": "images/v2/label_ba_bur_off.png", "after": "images/v2/label_ba_bur_on.png", "before_label": "mask off: v1 box (red)", "after_label": "mask on (green)", "caption": "3x zoom, 50% burial. Hidden fraction achieved 0.55. Note: v1 mode took the box from the clipped sprite alpha before soil; the visible-mask box also excludes the soil line and lip."}, {"label": "Mine covered by grass / debris, seed 307 #2 (box area x0.05)", "before": "images/v2/label_ba_over0_off.png", "after": "images/v2/label_ba_over0_on.png", "before_label": "mask off: v1 box (red)", "after_label": "mask on: visible-part box (green)", "caption": "3x zoom, no burial. Overgrowth (blades, leaves, rocks drawn over the mine) is subtracted from the mask, so the green box shrinks to the visible part."}, {"label": "Mine covered by grass / debris, seed 312 #2 (box area x0.73)", "before": "images/v2/label_ba_over1_off.png", "after": "images/v2/label_ba_over1_on.png", "before_label": "mask off: v1 box (red)", "after_label": "mask on: visible-part box (green)", "caption": "3x zoom, no burial. Overgrowth (blades, leaves, rocks drawn over the mine) is subtracted from the mask, so the green box shrinks to the visible part."}], "notes": "OPEN QUESTION: a mine fully hidden by overgrowth currently gets no box (LABEL_MIN_VISIBLE_PX = 1), so it becomes an unlabelled mine, i.e. a (rare) false negative for training; alternatives are keeping it labelled or dropping that image. A mine that is only a few pixels visible still gets a tiny box. Red = box with the mask switched off (v1 policy), green = visible-mask box. (No fully hidden mine turned up in the sampled seeds, so no example image.) In about 64 sampled 8-mine images no mine was fully hidden, so no example image is shown (the CHANGES notes report 2 of 192 mines hidden in their sample)."}, {"id": "flip", "title": "Face-up and face-down mines", "flag": "FLIP_PROB", "summary": "A mine on the ground can lie on its bottom or on its back, showing its underside. v2 flips each mine (rotated 180 degrees about its long axis) with probability FLIP_PROB = 0.30, so the detector sees both the top and the different underside shape, with the same colour, shading, shadow and burial machinery. Without it every training mine would show only its upper surface.", "how": "features/mesh.py: sample_pose returns (pitch, roll, yaw, face_down); a face-down mine starts from a rest attitude computed from the mesh's stable pose (about 1.5 deg off flat so a wing tip and the body touch the ground), and tilts of sigma 5 deg and the yaw are applied on top. MINE_POSE accepts a 4th value face_down; override {'flip': True/False} or FLIP_PROB.", "code": "DatasetGenerator/features/mesh.py: sample_pose, face_down_base; objects.py: Mine._render_mesh; controlPanel: FLIP_PROB", "options": [{"label": "FLIP_PROB = 0.0", "params": "flip_prob=0.0, seed 5, 8 mines (0 face down here)", "image": "images/v2/flip_prob_0_0.jpg", "caption": "Same scene, same positions and sizes; only which mines are flipped changes."}, {"label": "FLIP_PROB = 0.3", "params": "flip_prob=0.3, seed 5, 8 mines (4 face down here)", "image": "images/v2/flip_prob_0_3.jpg", "caption": "Same scene, same positions and sizes; only which mines are flipped changes."}, {"label": "FLIP_PROB = 1.0", "params": "flip_prob=1.0, seed 5, 8 mines (8 face down here)", "image": "images/v2/flip_prob_1_0.jpg", "caption": "Same scene, same positions and sizes; only which mines are flipped changes."}, {"label": "yaw strip: face up (top) vs face down (bottom)", "params": "mine_pose=(2, -2, yaw, face_down), yaw 0 / 60 / 120 / 200, seed 13, scale 0.35", "image": "images/v2/flip_strip.png", "caption": "Same mine and yaw in each column. Face down is a mirrored outline and shows the underside (flat base, different light and wing profile). 1.9x zoom."}], "before_after": [{"label": "Face up vs face down (seed 13)", "before": "images/v2/flip_ba_a_up.png", "after": "images/v2/flip_ba_a_down.png", "before_label": "face up", "after_label": "face down", "caption": "4x zoom, same mine, yaw and position. Shadow length 17 px up vs 18 px down (propped wing)."}, {"label": "Face up vs face down (seed 12)", "before": "images/v2/flip_ba_b_up.png", "after": "images/v2/flip_ba_b_down.png", "before_label": "face up", "after_label": "face down", "caption": "4x zoom, same mine, yaw and position. Shadow length 61 px up vs 66 px down (propped wing)."}], "notes": "A face-down mine props one wing on the body, so its shadow is longer than a face-up mine's (physically plausible). The underside geometry is plausible but untextured (no moulding detail). The mirrored silhouette is what makes it recognisably different from face-up at the same yaw."}, {"id": "whole", "title": "Whole-image comparison", "flag": "all flags (V2_FLAGS)", "summary": "The features above combined. Same seed, v1 against v2 shows the overall change; the ablation sheet switches each flag on alone; the 3x3 grid shows how varied v2 scenes are. FLIP_PROB = 0.30 applies to the v2 mines in the whole-image pictures (so about a third are face down) except in the ablation sheet, where mines are fixed face up.", "how": "render_scene(seed, overrides): v1 uses {'v1': True} (every flag off, v1 post shader); the ablation uses {'only': [FLAG]}. Each subsystem draws from its own random stream so a flag changes only its own feature.", "code": "DatasetGenerator/scene.py: render_scene; config.py: make_config (v1 / only); scripts/visual_check.py", "options": [{"label": "per-feature ablation sheet", "params": "seed 12, only=[FLAG] for each of ASSET_AUDIT_FILTER, NEW_ASSETS, LEAF_CLUMPS_NEW, GRASS_BLADES, MESH_MINES, SOFT_EDGES, SHADOWS, SOIL_BLEND, BURIAL, COLOUR_PALETTE, PHOTOMETRIC_JITTER, BLUR, BG_AUGMENT, LABEL_VISIBLE_MASK", "image": "images/v2/ablation_sheet.jpg", "caption": "Each tile enables one flag alone on top of the v1 pipeline (top-left = v1, last = everything). Features that need the mesh (burial, colour palette, mesh shadows) do little without MESH_MINES, as documented."}, {"label": "leave-one-out ablation sheet", "params": "seed 12, everything on except the named flag", "image": "images/v2/ablation_leave_one_out.jpg", "caption": "More informative than the only-one sheet: first tile is full v2, each other tile removes one feature. Turning NEW_ASSETS off or BG_AUGMENT off changes the background photo itself, so those tiles look different overall."}, {"label": "3x3 grid of v2 scenes", "params": "seeds 40-48, all defaults", "image": "images/v2/grid_3x3.jpg", "caption": "Nine unrelated v2 images at 460 px per tile: different ground, light, clutter and mines."}], "before_after": [{"label": "v1 vs v2, seed 5", "before": "images/v2/whole_ba_a_v1.jpg", "after": "images/v2/whole_ba_a_v2.jpg", "before_label": "v1", "after_label": "v2 (FLIP_PROB 0.3, 8 mines)", "caption": "Full frame at 2/3 size. v2: shadows consistent with one sun, varied mine colours, soil blending, grass blades, jitter."}, {"label": "v1 vs v2, seed 9", "before": "images/v2/whole_ba_b_v1.jpg", "after": "images/v2/whole_ba_b_v2.jpg", "before_label": "v1", "after_label": "v2 (FLIP_PROB 0.3, 8 mines)", "caption": "Full frame at 2/3 size. v2: shadows consistent with one sun, varied mine colours, soil blending, grass blades, jitter."}], "notes": "The v1 and v2 images share a seed, not a scene: v1 mode picks its backgrounds from the v1 pool and the v2 sampler differs, so the ground and mines are not identical. Per-flag ablation images keep the same random streams, so they are directly comparable. The ablation uses 3 mines at fixed positions, burial 35% for visibility and FLIP_PROB 0 (mines face up). In the only-one sheet, the NEW_ASSETS tile (and the all-on tile) draw a different background photo because that flag changes the background pool, so compare mines rather than ground there."}]}, {"id": "burial_review_2", "tab": "Review 2: buried mines", "type": "grid", "title": "Review: buried mines (current generator)", "intro": "24 single-mine crops (native-resolution 480x270 px window around the box (no upscaling)) with burial 0.1-0.5, random sun elevation 15-70 deg, 35% face down, 50% with blades forced over the mine, default dust (triangular 0.25-0.5) and grass-weighted backgrounds. Flag crops that look wrong (floating soil, odd outlines, unnatural clods) and add a note, then copy the flagged ids.", "glossary": {"burial": "Achieved hidden fraction of the mine's top-down area.", "visible_frac": "Visible mine pixels / unburied mine pixels (after soil and blades).", "dust": "Per-mine dust opacity ceiling.", "sun_el": "Sun elevation in degrees."}, "columns": ["id", "seed", "background", "sun_el", "burial", "face_down", "blades_on_mine", "visible_frac", "dust"], "items": [{"id": "c001", "image": "images/v2/review2/c001.jpg", "thumb": "images/v2/review2/c001.jpg", "before": "images/v2/review2/c001_before.jpg", "box": [0.3438, 0.363, 0.3125, 0.2741], "meta": {"seed": 6001, "background": "ground_bg_Ground029", "sun_el": 36.2, "burial": 0.15, "face_down": false, "blades_on_mine": 1, "visible_frac": 0.45, "dust": 0.37}, "caption": "target burial 0.13, scale 0.36", "tags": ["ground", "mid_sun", "blades"]}, {"id": "c002", "image": "images/v2/review2/c002.jpg", "thumb": "images/v2/review2/c002.jpg", "before": "images/v2/review2/c002_before.jpg", "box": [0.4302, 0.3259, 0.1396, 0.3481], "meta": {"seed": 6002, "background": "ground_bg_Ground031", "sun_el": 49.2, "burial": 0.38, "face_down": true, "blades_on_mine": 4, "visible_frac": 0.44, "dust": 0.37}, "caption": "target buria
