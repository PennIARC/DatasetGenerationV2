arams": "mine_pose=(2, -2, yaw, face_down), yaw 0 / 60 / 120 / 200, seed 13, scale 0.35", "image": "images/v2/flip_strip.png", "caption": "Same mine and yaw in each column. Face down is a mirrored outline and shows the underside (flat base, different light and wing profile). 1.9x zoom."}], "before_after": [{"label": "Face up vs face down (seed 13)", "before": "images/v2/flip_ba_a_up.png", "after": "images/v2/flip_ba_a_down.png", "before_label": "face up", "after_label": "face down", "caption": "4x zoom, same mine, yaw and position. Shadow length 17 px up vs 18 px down (propped wing)."}, {"label": "Face up vs face down (seed 12)", "before": "images/v2/flip_ba_b_up.png", "after": "images/v2/flip_ba_b_down.png", "before_label": "face up", "after_label": "face down", "caption": "4x zoom, same mine, yaw and position. Shadow length 61 px up vs 66 px down (propped wing)."}], "notes": "A face-down mine props one wing on the body, so its shadow is longer than a face-up mine's (physically plausible). The underside geometry is plausible but untextured (no moulding detail). The mirrored silhouette is what makes it recognisably different from face-up at the same yaw."}, {"id": "whole", "title": "Whole-image comparison", "flag": "all flags (V2_FLAGS)", "summary": "The features above combined. Same seed, v1 against v2 shows the overall change; the ablation sheet switches each flag on alone; the 3x3 grid shows how varied v2 scenes are. FLIP_PROB = 0.30 applies to the v2 mines in the whole-image pictures (so about a third are face down) except in the ablation sheet, where mines are fixed face up.", "how": "render_scene(seed, overrides): v1 uses {'v1': True} (every flag off, v1 post shader); the ablation uses {'only': [FLAG]}. Each subsystem draws from its own random stream so a flag changes only its own feature.", "code": "DatasetGenerator/scene.py: render_scene; config.py: make_config (v1 / only); scripts/visual_check.py", "options": [{"label": "per-feature ablation sheet", "params": "seed 12, only=[FLAG] for each of ASSET_AUDIT_FILTER, NEW_ASSETS, LEAF_CLUMPS_NEW, GRASS_BLADES, MESH_MINES, SOFT_EDGES, SHADOWS, SOIL_BLEND, BURIAL, COLOUR_PALETTE, PHOTOMETRIC_JITTER, BLUR, BG_AUGMENT, LABEL_VISIBLE_MASK", "image": "images/v2/ablation_sheet.jpg", "caption": "Each tile enables one flag alone on top of the v1 pipeline (top-left = v1, last = everything). Features that need the mesh (burial, colour palette, mesh shadows) do little without MESH_MINES, as documented."}, {"label": "leave-one-out ablation sheet", "params": "seed 12, everything on except the named flag", "image": "images/v2/ablation_leave_one_out.jpg", "caption": "More informative than the only-one sheet: first tile is full v2, each other tile removes one feature. Turning NEW_ASSETS off or BG_AUGMENT off changes the background photo itself, so those tiles look different overall."}, {"label": "3x3 grid of v2 scenes", "params": "seeds 40-48, all defaults", "image": "images/v2/grid_3x3.jpg", "caption": "Nine unrelated v2 images at 460 px per tile: different ground, light, clutter and mines."}], "before_after": [{"label": "v1 vs v2, seed 5", "before": "images/v2/whole_ba_a_v1.jpg", "after": "images/v2/whole_ba_a_v2.jpg", "before_label": "v1", "after_label": "v2 (FLIP_PROB 0.3, 8 mines)", "caption": "Full frame at 2/3 size. v2: shadows consistent with one sun, varied mine colours, soil blending, grass blades, jitter."}, {"label": "v1 vs v2, seed 9", "before": "images/v2/whole_ba_b_v1.jpg", "after": "images/v2/whole_ba_b_v2.jpg", "before_label": "v1", "after_label": "v2 (FLIP_PROB 0.3, 8 mines)", "caption": "Full frame at 2/3 size. v2: shadows consistent with one sun, varied mine colours, soil blending, grass blades, jitter."}], "notes": "The v1 and v2 images share a seed, not a scene: v1 mode picks its backgrounds from the v1 pool and the v2 sampler differs, so the ground and mines are not identical. Per-flag ablation images keep the same random streams, so they are directly comparable. The ablation uses 3 mines at fixed positions, burial 35% for visibility and FLIP_PROB 0 (mines face up). In the only-one sheet, the NEW_ASSETS tile (and the all-on tile) draw a different background photo because that flag changes the background pool, so compare mines rather than ground there."}]}]}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("showcase-data").textContent);
var PAGES = DATA.pages || [];
var $ = function(id){ return document.getElementById(id); };
var main = $("main"), tabsEl = $("tabs");

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k === "class") e.className = v;
    else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){} return null; }
function str(v){ return (typeof v === "string" && v.trim()) ? v : ""; }
function arr(v){ return Array.isArray(v) ? v : []; }

/* ---------- images ---------- */
function placeholder(label, cls, why){
  return el("div", {"class": "ph " + (cls || ""), role: "img", "aria-label": (label || "image") + " (" + why + ")"},
    [(label || "image") + " — " + why]);
}
function img(src, alt, cls){
  if (!src) return placeholder(alt, cls, "no image");
  var i = el("img", {src: src, alt: alt || "", loading: "lazy", decoding: "async", "class": cls || ""});
  i.addEventListener("error", function(){
    if (i.parentNode) i.parentNode.replaceChild(placeholder(alt, cls, "image missing"), i);
  });
  return i;
}

/* ---------- lightbox ---------- */
var lb = {items: [], idx: 0, opener: null};
function lbShow(){
  var it = lb.items[lb.idx]; if (!it) return;
  var st = $("lbStage"); st.textContent = "";
  st.appendChild(img(it.image, it.label, ""));
  var info = $("lbInfo"); info.textContent = "";
  info.appendChild(el("div", {text: it.label + "  (" + (lb.idx+1) + "/" + lb.items.length + ")"}));
  if (str(it.params)) info.appendChild(el("div", {"class":"par", text: it.params}));
  if (str(it.caption)) info.appendChild(el("div", {text: it.caption}));
  var multi = lb.items.length > 1;
  $("lbPrev").style.display = $("lbNext").style.display = multi ? "" : "none";
}
function lbOpen(items, idx, opener){
  lb.items = items; lb.idx = idx; lb.opener = opener;
  var box = $("lb"); box.hidden = false; box.classList.add("open");
  lbShow(); $("lbClose").focus();
}
function lbClose(){
  var box = $("lb"); box.classList.remove("open"); box.hidden = true;
  if (lb.opener) lb.opener.focus();
}
function lbStep(d){ var n = lb.items.length; if (!n) return; lb.idx = (lb.idx + d + n) % n; lbShow(); }
$("lbClose").addEventListener("click", lbClose);
$("lbPrev").addEventListener("click", function(){ lbStep(-1); });
$("lbNext").addEventListener("click", function(){ lbStep(1); });
$("lb").addEventListener("click", function(e){ if (e.target === $("lb") || e.target === $("lbStage")) lbClose(); });
document.addEventListener("keydown", function(e){
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") { e.preventDefault(); lbClose(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); lbStep(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); lbStep(1); }
  else if (e.key === "Tab") { /* keep focus inside dialog */
    var f = [$("lbClose"), $("lbPrev"), $("lbNext")].filter(function(b){ return b.style.display !== "none"; });
    var i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});

/* ---------- options gallery ---------- */
function gallery(opts){
  var items = opts.map(function(o){ o = o || {}; return {
    label: str(o.label) || "option", params: str(o.params), caption: str(o.caption), image: str(o.image)}; });
  var g = el("div", {"class": "grid"});
  items.forEach(function(it, i){
    var thumb = el("button", {"class": "thumb", type: "button", "aria-label": "Enlarge: " + it.label,
      onclick: function(ev){ lbOpen(items, i, ev.currentTarget); }}, [img(it.image, it.label, "")]);
    g.appendChild(el("figure", {"class": "opt"}, [thumb, el("figcaption", null, [
      el("div", {"class": "lbl", text: it.label}),
      it.params ? el("div", {"class": "par", text: it.params}) : null,
      it.caption ? el("div", {"class": "cap", text: it.caption}) : null])]));
  });
  return g;
}

/* ---------- before/after ---------- */
var uid = 0;
function beforeAfter(ba){
  ba = ba || {};
  var st = {b: {src: str(ba.before), label: str(ba.before_label) || "before"},
            a: {src: str(ba.after),  label: str(ba.after_label)  || "after"}, pos: 50, sbs: false};
  var title = str(ba.label) || "Comparison";
  var wrap = el("div", {"class": "ba"});
  var body = el("div");
  var sbsBtn = el("button", {"class": "btn", type: "button", "aria-pressed": "false", text: "Side by side"});
  var flipBtn = el("button", {"class": "btn", type: "button", text: "Flip"});
  wrap.appendChild(el("div", {"class": "ba-head"}, [el("strong", {text: title}), sbsBtn, flipBtn]));
  wrap.appendChild(body);
  if (str(ba.caption)) wrap.appendChild(el("p", {"class": "cap", text: ba.caption}));

  function render(){
    body.textContent = "";
    if (st.sbs){
      var mk = function(s){ return el("figure", null, [el("div", {"class": "im"}, [img(s.src, title + " " + s.label, "")]),
        el("figcaption", {text: s.label})]); };
      body.appendChild(el("div", {"class": "sbs"}, [mk(st.b), mk(st.a)]));
      return;
    }
    var slider = el("div", {"class": "slider", tabindex: "0", role: "slider",
      "aria-label": title + ": drag to compare " + st.b.label + " and " + st.a.label,
      "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(Math.round(st.pos)),
      "aria-valuetext": Math.round(st.pos) + "% " + st.b.label});
    var bottom = img(st.a.src, title + " " + st.a.label, "");
    var top = img(st.b.src, title + " " + st.b.label, "top");
    if (top.tagName === "IMG") top.classList.add("top");
    else top.classList.add("top");
    slider.appendChild(bottom); slider.appendChild(top);
    slider.appendChild(el("span", {"class": "tag l", text: st.b.label}));
    slider.appendChild(el("span", {"class": "tag r", text: st.a.label}));
    slider.appendChild(el("div", {"class": "handle"}));
    function set(p){
      st.pos = Math.max(0, Math.min(100, p));
      slider.style.setProperty("--pos", st.pos + "%");
      slider.setAttribute("aria-valuenow", String(Math.round(st.pos)));
      slider.setAttribute("aria-valuetext", Math.round(st.pos) + "% " + st.b.label);
    }
    function fromEvent(e){
      var r = slider.getBoundingClientRect();
      if (r.width > 0) set((e.clientX - r.left) / r.width * 100);
    }
    var dragging = false;
    slider.addEventListener("pointerdown", function(e){
      if (e.pointerType === "mouse" && e.button !== 0) return;
      dragging = true;
      try { slider.setPointerCapture(e.pointerId); } catch(x){}
      fromEvent(e); slider.focus({preventScroll: true});
    });
    slider.addEventListener("pointermove", function(e){ if (dragging) fromEvent(e); });
    var end = function(){ dragging = false; };
    slider.addEventListener("pointerup", end);
    slider.addEventListener("pointercancel", end);
    slider.addEventListener("keydown", function(e){
      var step = e.shiftKey ? 10 : 2, k = e.key;
      if (k === "ArrowLeft" || k === "ArrowDown") set(st.pos - step);
      else if (k === "ArrowRight" || k === "ArrowUp") set(st.pos + step);
      else if (k === "Home") set(0);
      else if (k === "End") set(100);
      else return;
      e.preventDefault();
    });
    set(st.pos);
    body.appendChild(slider);
  }
  sbsBtn.addEventListener("click", function(){
    st.sbs = !st.sbs; sbsBtn.setAttribute("aria-pressed", String(st.sbs)); render();
  });
  flipBtn.addEventListener("click", function(){ var t = st.b; st.b = st.a; st.a = t; render(); });
  render();
  return wrap;
}

/* ---------- feature card ---------- */
function featureCard(pageId, f){
  f = f || {};
  var id = pageId + "-" + (str(f.id) || "feature");
  var card = el("section", {"class": "card", id: id, "aria-labelledby": id + "-h"});
  var h = el("h2", {id: id + "-h"}, [str(f.title) || str(f.id) || "Feature"]);
  if (str(f.flag)) h.appendChild(el("span", {"class": "chip", title: "Config flag", text: f.flag}));
  card.appendChild(h);
  if (str(f.summary)) card.appendChild(el("p", {"class": "summary", text: f.summary}));
  if (str(f.how)) card.appendChild(el("p", {"class": "meta"}, [el("b", {text: "How it works: "}), f.how]));
  if (str(f.code)) card.appendChild(el("p", {"class": "meta"}, [el("b", {text: "Code: "}), el("code", {text: f.code})]));
  var opts = arr(f.options);
  if (opts.length){
    card.appendChild(el("h3", {text: "Options"}));
    card.appendChild(gallery(opts));
  }
  var bas = arr(f.before_after);
  if (bas.length){
    card.appendChild(el("h3", {text: "Before / after"}));
    bas.forEach(function(b){ card.appendChild(beforeAfter(b)); });
  }
  if (str(f.notes)) card.appendChild(el("div", {"class": "notes"}, [el("b", {text: "Limitations and notes"}), f.notes]));
  return card;
}

/* ---------- page ---------- */
var spy = null;
function renderPage(page, featureId){
  if (spy) { spy.disconnect(); spy = null; }
  main.textContent = "";
  main.setAttribute("aria-labelledby", "pageTitle");
  var head = el("div", {"class": "pagehead"}, [el("h1", {id: "pageTitle", text: str(page.title) || str(page.tab) || page.id})]);
  if (str(page.intro)) head.appendChild(el("p", {"class": "intro", text: page.intro}));
  main.appendChild(head);
  if (page.missing){
    main.appendChild(el("div", {"class": "empty", role: "status"}, [
      el("b", {text: "Images not generated yet. "}),
      page.missing === true ? "The manifest for this page was not found." : page.missing]));
    return;
  }
  var feats = arr(page.features);
  var gl = page.glossary && typeof page.glossary === "object" ? Object.keys(page.glossary) : [];
  if (gl.length){
    var dl = el("dl");
    gl.forEach(function(t){ dl.appendChild(el("dt", {text: t})); dl.appendChild(el("dd", {text: String(page.glossary[t])})); });
    main.appendChild(el("details", {"class": "glossary"}, [el("summary", {text: "Terms used on this page"}), dl]));
  }
  if (!feats.length){
    main.appendChild(el("div", {"class": "empty", role: "status", text: "No features listed for this page yet."}));
    return;
  }
  var ol = el("ol");
  feats.forEach(function(f){
    var fid = pageId(page) + "-" + (str(f.id) || "feature");
    ol.appendChild(el("li", null, [el("a", {href: "#" + fid, "data-fid": fid, text: str(f.title) || str(f.id) || "Feature",
      onclick: function(e){ e.preventDefault(); goto(page.id, f.id); }})]));
  });
  var toc = el("nav", {"class": "toc", "aria-label": "Features on this page"}, [el("h2", {text: "Features"}), ol]);
  var col = el("div");
  feats.forEach(function(f){ col.appendChild(featureCard(pageId(page), f)); });
  main.appendChild(el("div", {"class": "layout"}, [toc, col]));
  if ("IntersectionObserver" in window){
    var links = {};
    [].forEach.call(ol.querySelectorAll("a"), function(a){ links[a.getAttribute("data-fid")] = a; });
    spy = new IntersectionObserver(function(es){
      es.forEach(function(en){
        if (en.isIntersecting){
          for (var k in links) links[k].classList.remove("active");
          if (links[en.target.id]) links[en.target.id].classList.add("active");
        }
      });
    }, {rootMargin: "-20% 0px -70% 0px"});
    [].forEach.call(col.children, function(c){ spy.observe(c); });
  }
}
function pageId(p){ return p.id; }

/* ---------- routing / tabs ---------- */
var current = null;
function buildTabs(){
  tabsEl.textContent = "";
  PAGES.forEach(function(p, i){
    tabsEl.appendChild(el("button", {"class": "tab", role: "tab", id: "tab-" + p.id, type: "button",
      "aria-selected": "false", tabindex: "-1", "data-i": String(i), text: str(p.tab) || str(p.title) || p.id,
      onclick: function(){ goto(p.id); }}));
  });
}
tabsEl.addEventListener("keydown", function(e){
  var k = e.key, n = PAGES.length, i = PAGES.indexOf(current);
  var j = k === "ArrowRight" ? (i+1)%n : k === "ArrowLeft" ? (i-1+n)%n : k === "Home" ? 0 : k === "End" ? n-1 : -1;
  if (j < 0) return;
  e.preventDefault(); goto(PAGES[j].id);
  $("tab-" + PAGES[j].id).focus();
});
function parseHash(){
  var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  for (var i = 0; i < PAGES.length; i++){
    var id = PAGES[i].id;
    if (h === id) return {page: PAGES[i], feat: ""};
    if (h.indexOf(id + "-") === 0) return {page: PAGES[i], feat: h.slice(id.length + 1)};
  }
  return null;
}
function goto(pid, fid){
  location.hash = "#" + pid + (fid ? "-" + fid : "");   /* triggers hashchange -> apply() */
  if (location.hash === "#" + pid + (fid ? "-" + fid : "")) apply();
}
function apply(){
  var r = parseHash(), page, feat = "";
  if (r) { page = r.page; feat = r.feat; }
  else {
    var saved = store("showcase-tab");
    page = PAGES.filter(function(p){ return p.id === saved; })[0] || PAGES[0];
  }
  if (!page) { main.textContent = "No pages."; return; }
  if (page !== current){
    current = page;
    store("showcase-tab", page.id);
    [].forEach.call(tabsEl.children, function(t){
      var on = t.id === "tab-" + page.id;
      t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1;
    });
    document.title = (str(page.tab) || page.id) + " — Dataset Generator Showcase";
    renderPage(page, feat);
    window.scrollTo(0, 0);
  }
  if (feat){
    var t = document.getElementById(page.id + "-" + feat);
    if (t) t.scrollIntoView();
  }
}
window.addEventListener("hashchange", apply);

/* ---------- theme ---------- */
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function effectiveTheme(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t) return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
applyTheme(store("showcase-theme"));
$("themeBtn").addEventListener("click", function(){
  var n = effectiveTheme() === "dark" ? "light" : "dark";
  applyTheme(n); store("showcase-theme", n);
});

buildTabs();
apply();
})();
</script>
</body>
