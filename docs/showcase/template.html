<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dataset Generator Showcase</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface2:#eef0f4; --text:#1c2230; --muted:#5a6478;
  --border:#d8dce5; --accent:#2457d6; --accent-ink:#fff; --chip:#e6ecfb; --chipink:#1d3f9e;
  --warn-bg:#fff6df; --warn-bd:#e8c66a; --shadow:0 1px 3px rgba(20,30,50,.12);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --surface:#1b2029; --surface2:#242b37; --text:#e6e9f0; --muted:#9aa5ba;
    --border:#333c4c; --accent:#7ba2ff; --accent-ink:#0c1530; --chip:#25335a; --chipink:#c3d3ff;
    --warn-bg:#3a3118; --warn-bd:#7d6a2a; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b2029; --surface2:#242b37; --text:#e6e9f0; --muted:#9aa5ba;
  --border:#333c4c; --accent:#7ba2ff; --accent-ink:#0c1530; --chip:#25335a; --chipink:#c3d3ff;
  --warn-bg:#3a3118; --warn-bd:#7d6a2a; --shadow:0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.88em}
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{font-weight:700;margin-right:8px}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{font:inherit;border:1px solid transparent;background:transparent;color:var(--text);
  padding:7px 14px;border-radius:8px;cursor:pointer}
.tab:hover{background:var(--surface2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:5px 12px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn[aria-pressed="true"]{background:var(--chip);color:var(--chipink);border-color:var(--accent)}
main:has(.ggrid){max-width:none}
main{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
.pagehead h1{margin:.2em 0 .3em;font-size:1.9rem;line-height:1.2}
.pagehead p.intro{max-width:70ch;color:var(--muted);margin:0 0 14px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:10px}
.toc h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 6px 6px}
.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:block;padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--text);font-size:.92rem}
.toc a:hover{background:var(--surface2)}
.toc a.active{background:var(--chip);color:var(--chipink);font-weight:600}
details.glossary{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin-bottom:18px}
details.glossary summary{cursor:pointer;font-weight:600;padding:4px 0}
details.glossary dl{margin:8px 0 4px;display:grid;grid-template-columns:max-content 1fr;gap:6px 16px}
details.glossary dt{font-weight:600}
details.glossary dd{margin:0;color:var(--muted)}
details.glossary dt,details.glossary dd{min-width:0;overflow-wrap:anywhere}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:22px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:1.4rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card h3{margin:20px 0 8px;font-size:1.05rem}
.chip{font:600 .75rem var(--mono);background:var(--chip);color:var(--chipink);padding:2px 9px;border-radius:99px}
.summary{margin:0 0 8px}
.meta{margin:4px 0;color:var(--muted);font-size:.93rem}
.meta b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.opt{background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:0;display:flex;flex-direction:column}
.opt button.thumb{all:unset;display:block;cursor:zoom-in;aspect-ratio:4/3;background:var(--surface2);overflow:hidden}
.opt button.thumb:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.opt img,.opt .ph{width:100%;height:100%;object-fit:cover;display:block}
.opt figcaption{padding:8px 10px 10px}
.opt .lbl{font-weight:700}
.opt .par{font-family:var(--mono);font-size:.8rem;color:var(--muted);word-break:break-word}
.opt .cap{font-size:.86rem;margin-top:4px}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 10px,var(--bg) 10px,var(--bg) 20px);
  color:var(--muted);font-size:.85rem;border:1px dashed var(--border)}
.ba{margin:0 0 20px}
.ba-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ba-head strong{margin-right:auto}
.slider{position:relative;aspect-ratio:16/9;max-width:900px;overflow:hidden;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.slider img,.slider .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.slider .top{clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0)}
.slider .handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:3px;margin-left:-1.5px;background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.45);pointer-events:none}
.slider .handle::after{content:"\2194";position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
  border-radius:50%;background:#fff;color:#222;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 5px rgba(0,0,0,.5);font-size:20px}
.slider:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tag{position:absolute;top:8px;padding:2px 9px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.78rem;
  font-weight:600;pointer-events:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.l{left:8px}.tag.r{right:8px}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:1000px}
.sbs figure{margin:0}
.sbs .im{aspect-ratio:16/9;position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.sbs img,.sbs .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sbs figcaption{text-align:center;font-weight:600;font-size:.9rem;margin-top:4px}
.ba .cap{color:var(--muted);font-size:.9rem;margin:6px 0 0;max-width:80ch}
.notes{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:8px;padding:10px 14px;margin-top:14px}
.notes b{display:block;margin-bottom:2px}
.ptable{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:18px;box-shadow:var(--shadow)}
.ptable h2{font-size:1.1rem;margin:0 0 8px}
.ptable .scroll,.facts{overflow-x:auto}
.ptable table,.facts table{border-collapse:collapse;width:100%;font-size:.9rem}
.ptable th,.ptable td,.facts th,.facts td{text-align:left;vertical-align:top;padding:5px 8px;border-bottom:1px solid var(--border)}
.ptable th{background:var(--surface2);font-weight:600;position:sticky;top:0}
.facts th{width:12em;color:var(--muted);font-weight:600}
.ptable .tnote{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.figure{margin:12px 0 0}
.figure button{all:unset;display:block;cursor:zoom-in;width:100%}
.figure img,.figure .ph{width:100%;height:auto;display:block;border:1px solid var(--border);border-radius:8px;background:#fff;min-height:120px}
.figure figcaption{color:var(--muted);font-size:.9rem;margin-top:4px}
.empty{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:10px;padding:18px;max-width:70ch}
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.lb img,.lb .ph{max-width:92vw;max-height:58vh;object-fit:contain;min-width:260px;min-height:160px}
.lb .info{color:#fff;text-align:center;margin-top:10px;max-width:80ch;max-height:30vh;overflow:auto}
.lb .info .par{font-family:var(--mono);font-size:.85rem;opacity:.8}
.lb .nav,.lb .close{position:absolute;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:26px;cursor:pointer}
.lb .nav:hover,.lb .close:hover{background:rgba(255,255,255,.35)}
.lb .prev{left:12px;top:50%}.lb .next{right:12px;top:50%}.lb .close{top:12px;right:12px}
@media (max-width:899px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;max-height:none}
  .toc ol{display:flex;flex-wrap:wrap;gap:4px}
}
@media (max-width:600px){
  .brand{display:none}
  .sbs{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  details.glossary dl{grid-template-columns:minmax(0,1fr)}
  .pagehead h1{font-size:1.5rem}
}

/* review grid */
.gbar{position:sticky;top:var(--tb,56px);z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;margin:0 0 14px;box-shadow:var(--shadow);max-height:70vh;overflow:auto}
.grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow+.grow,.grow+details,details+.grow{margin-top:8px}
.counts{font-weight:600;margin-right:auto}
.gstatus{color:var(--muted);font-size:.88rem}
.gfilters summary{cursor:pointer;font-weight:600}
.gfilters .fields{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:8px}
.fld{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:2px}
.fld input,.fld select{font:inherit;font-size:.9rem;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 6px;max-width:150px}
.fld input[type=number]{width:78px}
.fld.pair .p{display:flex;gap:4px;align-items:center}
.gfb{margin-top:8px}.gfb textarea{width:100%;font:.85rem var(--mono);background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px}
.ggrid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:12px}
.gcard{background:var(--surface);border:2px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.gcard.flagged,tr.flagged{border-color:#d33;box-shadow:0 0 0 2px rgba(220,50,50,.35)}
.gcard .thumb{all:unset;display:block;position:relative;cursor:zoom-in;aspect-ratio:16/9;width:100%;background:#111;overflow:hidden}
.gcard .thumb:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.gcard img,.gcard .ph{width:100%;height:100%;object-fit:cover;display:block}
.gcard .gb{padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gcard .gid{font-weight:700}
.bbox{display:none;position:absolute;border:2px solid #22e05a;box-shadow:0 0 0 1px #000;pointer-events:none}
.gcard.showbox .bbox{display:block}
.stage{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);color:#fff;font:600 .8rem var(--mono);padding:3px 8px;border-radius:4px;pointer-events:none}
.flipbtn{font:inherit;font-size:1rem;font-weight:600;padding:8px;border:2px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}
.flipbtn:hover{background:var(--surface)}
.gcard .gm{font:.62rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.gcard.flagged .gid::after{content:" \2691";color:#d33}
.flag{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;font-weight:600;cursor:pointer;padding:8px;border:2px solid var(--border);border-radius:8px;background:var(--bg)}
.gcard.flagged .flag{background:rgba(220,50,50,.18);border-color:#d33}
.flag input{width:22px;height:22px}
.note{font:inherit;font-size:.85rem;width:100%;box-sizing:border-box;resize:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1;min-width:0}
.twrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table.gt{border-collapse:collapse;width:100%;font-size:.85rem}
table.gt th,table.gt td{padding:4px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
table.gt th{position:sticky;top:0;background:var(--surface2)}
table.gt th button{all:unset;cursor:pointer;font-weight:700}
table.gt th button:focus-visible{outline:2px solid var(--accent)}
table.gt td img,table.gt td .ph{width:56px;height:56px;object-fit:contain;background:#111;display:block;padding:0}
table.gt tr:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
table.gt tr.flagged{box-shadow:inset 3px 0 0 #d33;background:rgba(220,50,50,.08)}
table.gt .thumb{all:unset;cursor:zoom-in;display:block}
.lb .tbl{margin:8px auto 0;border-collapse:collapse;font:.82rem var(--mono);text-align:left}
.lb .tbl td{padding:1px 10px;border-bottom:1px solid rgba(255,255,255,.2)}
.lb .fbtn{margin-top:8px;font:inherit;padding:5px 12px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer}
.lb .fbtn[aria-pressed="true"]{background:#d33;border-color:#d33}
@media (max-width:600px){.gfilters .fields{gap:8px}.gbar{max-height:60vh}}
/* dataset live sample (page type "dataset", needs scripts/serve_dataset_view.py) */
main:has(.dsview){max-width:none}
.dinfo{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px;box-shadow:var(--shadow)}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dhead .big{font-size:1.25rem;font-weight:700}
.badge{font:600 .78rem var(--sans);padding:3px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.badge.generating{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.badge.complete{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge.idle,.badge.offline,.badge.missing{background:var(--warn-bg);border-color:var(--warn-bd)}
.pbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:0 0 10px;border:1px solid var(--border)}
.pbar>div{height:100%;background:var(--accent);width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:8px;padding:6px 10px;min-width:0}
.stat .k{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-weight:600;overflow-wrap:anywhere}
.stat .s{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.dfail{margin-top:8px;font-size:.88rem;color:var(--muted)}
.dfail pre{font:.78rem var(--mono);white-space:pre-wrap;margin:4px 0}
.dgrid.showbox .bbox,.lbwrap.showbox .bbox{display:block}
.dgrid .gm{font:.78rem var(--sans);color:var(--text)}
.dgrid .gpar{font:.68rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.dgrid.nopar .gpar{display:none}
.lbwrap{position:relative;display:inline-block;line-height:0}
.dsview .empty code{background:var(--surface);padding:2px 6px;border-radius:4px}
.dspick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;font-size:.9rem}
.dspick select{font:inherit;max-width:100%;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.dspick .s{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* training live view (page type "training", needs scripts/serve_dataset_view.py) */
main:has(.trview){max-width:1600px}
.trview{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--bad:#c62f2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .trview{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--bad:#e66767}}
:root[data-theme="dark"] .trview{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--bad:#e66767}
.trview .fld select{max-width:min(420px,80vw)}
.badge.running{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.badge.finished{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge.failed{background:var(--bad);border-color:var(--bad);color:#fff}
.badge.none,.badge.loading{background:var(--warn-bg);border-color:var(--warn-bd)}
.conn{font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.conn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.conn.live::before{background:#1f8f4e;box-shadow:0 0 0 3px rgba(31,143,78,.25)}
.conn.polling::before{background:#d49a00}
.conn.offline::before{background:var(--bad)}
.tbar{position:relative;height:18px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border);margin:4px 0 4px}
.tbar>div{position:absolute;top:0;bottom:0;left:0;transition:width .5s}
.tbar .done{background:var(--accent)}
.tbar .cur{background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 6px,transparent 6px,transparent 12px);opacity:.55}
.tbar.small{height:8px}
.plabel{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px;margin:0 0 16px}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px 8px;box-shadow:var(--shadow);min-width:0;position:relative;margin:0}
.chart h3{margin:0;font-size:1rem}
.chart .sub{font-size:.78rem;color:var(--muted);margin:0 0 4px}
.chart .legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.8rem;color:var(--text);margin:2px 0 2px}
.chart .sw{display:inline-block;width:20px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.chart .sw.dot{width:9px;height:9px;border:2px solid;border-radius:50%;background:var(--surface)}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart svg text{fill:var(--muted);font:11px var(--sans)}
.chart svg .ax{stroke:var(--muted);stroke-width:1}
.chart svg .gl{stroke:var(--border);stroke-width:1}
.chart svg .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:5px 8px;font-size:.78rem;box-shadow:var(--shadow);white-space:nowrap}
.chart .tip b{display:block}
.chart .nodata{font-size:.85rem;color:var(--muted);padding:30px 0;text-align:center}
.trview h2.sec{font-size:1.15rem;margin:18px 0 8px}
.trview tr.best td{font-weight:700}
table th.num,table td.num{text-align:right;font-variant-numeric:tabular-nums}
table{font-variant-numeric:tabular-nums}
.stat .v,.stat .s{overflow-wrap:break-word}
/* toolbars: labelled fields (label above the control) and buttons share one baseline and one control height */
.grow{align-items:flex-end}
.grow>.gstatus{min-height:34px;display:inline-flex;align-items:center}
.fld input,.fld select{min-height:34px;box-sizing:border-box}
.rgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.trview pre.log{font:.78rem var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface2);padding:8px;border-radius:8px;margin:6px 0}
.trview .empty code{background:var(--surface);padding:2px 6px;border-radius:4px}
/* training: live test examples */
.lpstatus{font-size:.88rem;color:var(--muted);margin:0 0 8px}
.lpstatus.empty{color:var(--text)}
.lpstatus code{background:var(--surface);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.lpwait{margin-top:6px;color:var(--text)}
.lpbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 6px}
.lpctl{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;flex-wrap:wrap;min-width:0;max-width:100%}
.lpctl input[type=range]{min-width:0;width:140px;max-width:40vw}
.lpctl .btn{min-height:32px;box-sizing:border-box}
.lpk{color:var(--muted)}
.lpval{font-variant-numeric:tabular-nums;min-width:4ch}
.lplegend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;margin:0 0 6px;align-items:center}
.lplegend>span{display:inline-flex;align-items:center;gap:5px}
.lpsw{display:inline-block;width:18px;height:11px;border:1.5px solid #22e05a;box-sizing:border-box}
.lpsw.fn{border-style:dashed}
.lpsw.pr{border:2px solid #ff3b3b}
.lpsw.pr.fp{border-style:dashed}
.lpsum{font-size:.9rem;margin:0 0 8px;font-variant-numeric:tabular-nums}
.lpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px;margin:0 0 12px}
.lpcard{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:0}
.lpopen{all:unset;cursor:zoom-in;display:block;width:100%}
.lpopen:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.lpimg{position:relative;line-height:0;background:#111;width:100%}
.lpimg img{width:100%;height:100%;display:block;object-fit:contain}
.lb .lpimg img{max-width:none;max-height:none;min-width:0;min-height:0}
.lpimg svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lpimg .lpgt{fill:none;stroke:#22e05a;stroke-width:1.25;vector-effect:non-scaling-stroke}
.lpimg .lpgt.fn{stroke-dasharray:4 3;stroke-width:2}
.lpimg .lppr{fill:none;stroke:#ff3b3b;stroke-width:2;vector-effect:non-scaling-stroke}
.lpimg .lppr.fp{stroke-dasharray:5 3}
.lpimg .lpconf{fill:#fff;stroke:#000;paint-order:stroke;font-family:var(--mono);font-weight:700}
.lpcap{padding:5px 8px;font-size:.78rem;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.lpname{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 100%;min-width:0}
.lpn{color:var(--muted)}
.lpb{font:600 .72rem var(--mono);padding:1px 6px;border-radius:99px;border:1px solid var(--border);font-variant-numeric:tabular-nums}
.lpb.tp{color:#1f8f4e;border-color:#1f8f4e}
.lpb.fp{color:var(--bad);border-color:var(--bad)}
.lpb.fn{color:#b07800;border-color:#d49a00}
.lpb.none{color:var(--muted)}
.lpcharts{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("showcase-data").textContent);
var PAGES = DATA.pages || [], ASSETS = DATA.assets || {};

var main = $("main"), tabsEl = $("tabs");

function el(tag, attrs, kids){

}
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){} return null; }
function str(v){ return (typeof v === "string" && v.trim()) ? v : ""; }
function arr(v){ return Array.isArray(v) ? v : []; }
/* stat tiles: keep "box 0.779", "12.0 s", "mAP50-95" on one line; lines break only between items */
function nbsp(t){ return typeof t === "string" ? t.replace(/([A-Za-z0-9.]) (?=[0-9–≈%]|s\b|min\b|h\b|GB\b|MB\b|px\b)/g, "$1\u00a0").replace(/([A-Za-z0-9])-(?=[0-9])/g, "$1\u2011") : t; }
/* table alignment: a column whose cells are all numbers (optionally with a unit, or blank / dash) is right-aligned,
   header included (class "num"); every other column stays left-aligned, header included */
var NUM_RE = /^[-+\u2212]?(\d[\d,]*(\.\d*)?|\.\d+)(e[-+]?\d+)?\s*(%|s|px|ms|GB|MB|KB|B|°|x|×)?$/i;

function numCol(values){ var any = false; for (var i = 0; i < values.length; i++){ var v = String(values[i] === null || values[i] === undefined ? "" : values[i]).trim(); if (!isNumText(v)) return false; if (v && v !== "–" && v !== "-") any = true; } return any; }

/* ---------- images ---------- */
function placeholder(label, cls, why){
  return el("div", {"class": "ph " + (cls || ""), role: "img", "aria-label": (label || "image") + " (" + why + ")"},

}
/* frame follows the image's own aspect ratio (e.g. 16:9 renders, 640x640 dataset crops); CSS value = fallback */

/* ---------- lightbox ---------- */
var lb = {items: [], idx: 0, opener: null};

    it.boxes.forEach(function(b){ bw.appendChild(boxDiv(b)); });

  } else st.appendChild(img(it.image, it.label, ""));

      onclick: function(){ it.toggle(); lbShow(); $("lbStage").focus && 0; }}));
  }
  if (it.boxes){
    var bon = it.boxesOn();
    info.appendChild(el("button", {"class":"fbtn", type:"button", "aria-pressed": String(bon), text: bon ? "Boxes: on (b)" : "Boxes: off (b)",
      onclick: function(){ it.toggleBoxes(); lbShow(); }}));

}
function lbOpen(items, idx, opener){
  lb.items = items; lb.idx = idx; lb.opener = opener;
  var box = $("lb"); box.hidden = false; box.classList.add("open");
  lbShow(); $("lbClose").focus();
}
function lbClose(){
  var box = $("lb"); box.classList.remove("open"); box.hidden = true;
  if (lb.opener) lb.opener.focus();
}
function lbStep(d){ var n = lb.items.length; if (!n) return; lb.idx = (lb.idx + d + n) % n; lbShow(); }
$("lbClose").addEventListener("click", lbClose);
$("lbPrev").addEventListener("click", function(){ lbStep(-1); });
$("lbNext").addEventListener("click", function(){ lbStep(1); });
$("lb").addEventListener("click", function(e){ if (e.target === $("lb") || e.target === $("lbStage")) lbClose(); });
document.addEventListener("keydown", function(e){
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") { e.preventDefault(); lbClose(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); lbStep(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); lbStep(1); }
  else if ((e.key === "b" || e.key === "B") && lb.items[lb.idx] && lb.items[lb.idx].toggleBoxes) { e.preventDefault(); lb.items[lb.idx].toggleBoxes(); lbShow(); }
  else if ((e.key === "f" || e.key === "F") && lb.items[lb.idx] && lb.items[lb.idx].toggle) { e.preventDefault(); lb.items[lb.idx].toggle(); lbShow(); }

    var f = [$("lbClose"), $("lbPrev"), $("lbNext")].concat([].slice.call(document.querySelectorAll("#lbInfo button"))).filter(function(b){ return b.style.display !== "none"; });
    var i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();

});

/* ---------- options gallery ---------- */
function gallery(opts){
  var items = opts.map(function(o){ o = o || {}; return {
    label: str(o.label) || "option", params: str(o.params), caption: str(o.caption), image: str(o.image)}; });
  var g = el("div", {"class": "grid"});
  items.forEach(function(it, i){
    var thumb = el("button", {"class": "thumb", type: "button", "aria-label": "Enlarge: " + it.label,
      onclick: function(ev){ lbOpen(items, i, ev.currentTarget); }}, [img(it.image, it.label, "")]);
    g.appendChild(el("figure", {"class": "opt"}, [thumb, el("figcaption", null, [
      el("div", {"class": "lbl", text: it.label}),
      it.params ? el("div", {"class": "par", text: it.params}) : null,
      it.caption ? el("div", {"class": "cap", text: it.caption}) : null])]));
  });

}

/* ---------- before/after ---------- */
var uid = 0;
function beforeAfter(ba){
  ba = ba || {};
  var st = {b: {src: str(ba.before), label: str(ba.before_label) || "before"},
            a: {src: str(ba.after),  label: str(ba.after_label)  || "after"}, pos: 50, sbs: false};
  var title = str(ba.label) || "Comparison";
  var wrap = el("div", {"class": "ba"});
  var body = el("div");
  var sbsBtn = el("button", {"class": "btn", type: "button", "aria-pressed": "false", text: "Side by side"});
  var flipBtn = el("button", {"class": "btn", type: "button", text: "Flip"});
  wrap.appendChild(el("div", {"class": "ba-head"}, [el("strong", {text: title}), sbsBtn, flipBtn]));
  wrap.appendChild(body);
  if (str(ba.caption)) wrap.appendChild(el("p", {"class": "cap", text: ba.caption}));

  function render(){
    body.textContent = "";
    if (st.sbs){
      var mk = function(s){ var im = img(s.src, title + " " + s.label, ""), box = el("div", {"class": "im"}, [im]);
        fitAspect(box, im);
        return el("figure", null, [box, el("figcaption", {text: s.label})]); };

    }

      "aria-label": title + ": drag to compare " + st.b.label + " and " + st.a.label,
      "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(Math.round(st.pos)),
      "aria-valuetext": Math.round(st.pos) + "% " + st.b.label});
    var bottom = img(st.a.src, title + " " + st.a.label, "");
    var top = img(st.b.src, title + " " + st.b.label, "top");
    if (top.tagName === "IMG") top.classList.add("top");
    else top.classList.add("top");
    slider.appendChild(bottom); slider.appendChild(top);
    fitAspect(slider, bottom, 75);
    slider.appendChild(el("span", {"class": "tag l", text: st.b.label}));
    slider.appendChild(el("span", {"class": "tag r", text: st.a.label}));
    slider.appendChild(el("div", {"class": "handle"}));
    function set(p){

      if (e.pointerType === "mouse" && e.button !== 0) return;

      try { slider.setPointerCapture(e.pointerId); } catch(x){}
      fromEvent(e); slider.focus({preventScroll: true});
    });
    slider.addEventListener("pointermove", function(e){ if (dragging) fromEvent(e); });
    var end = function(){ dragging = false; };
    slider.addEventListener("pointerup", end);
    slider.addEventListener("pointercancel", end);
    slider.addEventListener("keydown", function(e){
      var step = e.shiftKey ? 10 : 2, k = e.key;

  }

    st.sbs = !st.sbs; sbsBtn.setAttribute("aria-pressed", String(st.sbs)); render();
  });
  flipBtn.addEventListener("click", function(){ var t = st.b; st.b = st.a; st.a = t; render(); });

}


/* ---------- review grid ---------- */
var gridResize = null, gridCleanup = null;
var PREF = ["background","sun_el","burial","face_down","blades_on_mine"];
function fmt(v){
  if (v === true) return "yes"; if (v === false) return "no";
  if (v === null || v === undefined) return "–";
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(Math.round(v * 1000) / 1000);
  if (Array.isArray(v)) return v.join(", ");
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}
function num(v){ return (typeof v === "number" && isFinite(v)) ? v : null; }
function renderGrid(page){
  var pkey = "showcase-flags:" + page.id;
  var flags = new Map();
  try {
    var o0 = JSON.parse(store(pkey) || "{}");
    if (o0 && typeof o0 === "object" && !Array.isArray(o0)) Object.keys(o0).forEach(function(k){
      var v = o0[k]; if (v && typeof v === "object") flags.set(k, {f: v.f ? 1 : 0, n: typeof v.n === "string" ? v.n : ""}); });
  } catch(e){}
  var saveTimer = null;
  function writeNow(){
    saveTimer = null; var o = {};
    flags.forEach(function(v, k){ o[k] = v; });
    store(pkey, JSON.stringify(o));
  }
  function save(){ if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 300); }
  gridCleanup = function(){ if (saveTimer) { clearTimeout(saveTimer); writeNow(); } if (io) io.disconnect(); };
  var items = arr(page.items).filter(function(x){ return x && typeof x === "object"; }).map(function(it, i){
    return {id: (it.id === undefined || it.id === null || String(it.id) === "") ? "item" + (i + 1) : String(it.id), idx: i,
      meta: (it.meta && typeof it.meta === "object" && !Array.isArray(it.meta)) ? it.meta : {},
      tags: arr(it.tags).map(String), image: str(it.image), thumb: str(it.thumb), caption: str(it.caption),
      before: str(it.before), box: Array.isArray(it.box) && it.box.length === 4 ? it.box : null};
  });
  var present = {}, keys = [], seen = {};
  items.forEach(function(it){ Object.keys(it.meta).forEach(function(k){ present[k] = 1; }); });
  function addKey(k){ if (!seen[k]) { seen[k] = 1; keys.push(k); } }
  arr(page.columns).forEach(function(k){ if (present[k]) addKey(k); });
  items.forEach(function(it){ Object.keys(it.meta).forEach(addKey); });
  function findKey(c){ for (var i = 0; i < c.length; i++) if (present[c[i]]) return c[i]; return ""; }
  var kBg = findKey(["background"]), kSun = findKey(["sun_el","sun_elevation"]), kBur = findKey(["burial","burial_frac"]),
      kFace = findKey(["face_down"]), kBl = findKey(["blades_on_mine","blades"]), kSeed = findKey(["seed"]);
  var cardKeys = PREF.filter(function(k){ return present[k]; }).slice(0, 3);
  if (!cardKeys.length) cardKeys = keys.slice(0, 3);
  var tagSet = {}; items.forEach(function(it){ it.tags.forEach(function(t){ tagSet[t] = 1; }); });
  var famSet = {};
  if (kBg) items.forEach(function(it){ if (it.meta[kBg] !== undefined) famSet[String(it.meta[kBg]).split("_")[0]] = 1; });

  items.forEach(function(it){   /* precomputed index for fast filter/sort */
    var m = it.meta, b = kBl ? m[kBl] : undefined;
    it.fam = kBg && m[kBg] !== undefined ? String(m[kBg]).split("_")[0] : null;
    it.sun = kSun ? num(m[kSun]) : null; it.bur = kBur ? num(m[kBur]) : null;
    it.face = kFace ? m[kFace] === true : false;
    it.blades = b === true || (num(b) !== null && b > 0);
    it.tagSet = {}; it.tags.forEach(function(t){ it.tagSet[t] = 1; }); it.low = {};
  });
  var io = null;

  var S = {view: store("showcase-view") === "table" ? "table" : "grid",
    cols: parseInt(store("showcase-cols2"), 10) || (window.innerWidth < 600 ? 1 : 3),
    bg: "", sunMin: "", sunMax: "", burMin: "", burMax: "", face: "", blades: "", tag: "", fk: "", fq: "",
    sort: "id", dir: 1, only: false};
  S.cols = Math.max(1, Math.min(10, S.cols));

  function isFl(id){ var o = flags.get(id); return !!(o && o.f); }
  function noteOf(id){ var o = flags.get(id); return (o && o.n) || ""; }
  function touch(id){ var o = flags.get(id); if (!o) { o = {f: 0, n: ""}; flags.set(id, o); } return o; }
  function prune(id){ var o = flags.get(id); if (o && !o.f && !o.n) flags.delete(id); }
  var nodes = [], visible = [];
  function setFlag(id, v){ touch(id).f = v ? 1 : 0; prune(id); save(); sync(); }
  function setNote(id, t){ touch(id).n = t; prune(id); save(); }
  function annotatedItems(){ return items.filter(function(it){ return isFl(it.id) || noteOf(it.id); }); }
  function flaggedItems(){ return items.filter(function(it){ return isFl(it.id); }); }
  function sync(){
    nodes.forEach(function(n){ var f = isFl(n.id); n.root.classList.toggle("flagged", f); n.cb.checked = f; });
    updateCounts();
  }

  function inRange(v, lo, hi){
    var l = parseFloat(lo), h = parseFloat(hi);
    if (isNaN(l) && isNaN(h)) return true;

    if (!inRange(it.bur, S.burMin, S.burMax)) return false;
    if (S.face && it.face !== (S.face === "yes")) return false;
    if (S.blades && it.blades !== (S.blades === "yes")) return false;
    if (S.tag && !it.tagSet[S.tag]) return false;
    if (S.fk && S.fq){
      var s = it.low[S.fk]; if (s === undefined) s = it.low[S.fk] = fmt(it.meta[S.fk]).toLowerCase();
      if (s.indexOf(S.fq.toLowerCase()) < 0) return false;

  function sortVal(it){ return S.sort === "id" ? it.id : it.meta[S.sort]; }
  function cmp(a, b){
    var x = sortVal(a), y = sortVal(b), nx = x === undefined || x === null, ny = y === undefined || y === null;

tabsEl.addEventListener("keydown", function(e){
  var k = e.key, n = PAGES.length, i = PAGES.indexOf(current);
  var j = k === "ArrowRight" ? (i+1)%n : k === "ArrowLeft" ? (i-1+n)%n : k === "Home" ? 0 : k === "End" ? n-1 : -1;
  if (j < 0) return;
  e.preventDefault(); goto(PAGES[j].id);
  $("tab-" + PAGES[j].id).focus();
});
function parseHash(){
  var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  for (var i = 0; i < PAGES.length; i++){
    var id = PAGES[i].id;
    if (h === id) return {page: PAGES[i], feat: ""};
    if (h.indexOf(id + "-") === 0) return {page: PAGES[i], feat: h.slice(id.length + 1)};
  }
  return null;
}
function goto(pid, fid){
  location.hash = "#" + pid + (fid ? "-" + fid : "");   /* triggers hashchange -> apply() */
  if (location.hash === "#" + pid + (fid ? "-" + fid : "")) apply();
}
function apply(){
  var r = parseHash(), page, feat = "";
  if (r) { page = r.page; feat = r.feat; }
  else {
    var saved = store("showcase-tab");
    page = PAGES.filter(function(p){ return p.id === saved; })[0] || PAGES[0];
  }
  if (!page) { main.textContent = "No pages."; return; }
  if (page !== current){
    current = page;
    store("showcase-tab", page.id);
    [].forEach.call(tabsEl.children, function(t){
      var on = t.id === "tab-" + page.id;
      t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1;
    });
    document.title = (str(page.tab) || page.id) + " — Dataset Generator Showcase";
    renderPage(page, feat);
    window.scrollTo(0, 0);
  }
  if (feat){
    var t = document.getElementById(page.id + "-" + feat);
    if (t) t.scrollIntoView();
  }
}
window.addEventListener("hashchange", apply);
window.addEventListener("pagehide", function(){ if (gridCleanup) gridCleanup(); if (trCleanup) { trCleanup(); trCleanup = null; } });
document.addEventListener("visibilitychange", function(){ if (document.hidden && gridCleanup) gridCleanup(); });
window.addEventListener("pageshow", function(e){ if (e.persisted && current && current.type === "training"){ current = null; apply(); } });
function setTb(){ var h = document.querySelector(".topbar"); if (h) document.documentElement.style.setProperty("--tb", h.offsetHeight + "px"); }
window.addEventListener("resize", function(){ setTb(); if (gridResize) gridResize(); });

/* ---------- theme ---------- */
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function effectiveTheme(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t) return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
applyTheme(store("showcase-theme"));
$("themeBtn").addEventListener("click", function(){
  var n = effectiveTheme() === "dark" ? "light" : "dark";
  applyTheme(n); store("showcase-theme", n);
});

buildTabs();
setTb();
apply();
})();
</script>
</body>
</html>
